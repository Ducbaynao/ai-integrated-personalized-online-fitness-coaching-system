services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: digital_fitness
      POSTGRES_USER: fitness_app
      POSTGRES_PASSWORD: change-me
      TZ: UTC
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U fitness_app -d digital_fitness"
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../services/backend/src/main/resources/db/migration:/flyway/sql:ro
    command:
      - "-url=jdbc:postgresql://postgres:5432/digital_fitness"
      - "-user=fitness_app"
      - "-password=change-me"
      - "-schemas=fitness"
      - "-defaultSchema=fitness"
      - "-connectRetries=60"
      - "migrate"
