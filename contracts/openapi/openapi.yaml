        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingConflict' }
  /coaching/relationships/{relationshipId}/{action}:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [accept, reject, cancel, pause, end] }
    post:
      tags: [Coaching Lifecycle]
      operationId: decideCoachingRelationship
      summary: Accept, reject, cancel, pause, or end according to participant and state rules
      description: >-
        End requires a nonblank reason; the command is the explicit end confirmation.
        A fresh successful End returns its result, but a former Trainer's later replay
        of any command receipt, including End, is concealed as 404. Student replay
        retains access to the saved result under current Student capability checks.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingActionRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/CoachingOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingConflict' }
  /coaching/relationships/{relationshipId}/resume-requests:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
    get:
      tags: [Coaching Lifecycle]
      operationId: listCoachingResumeRequests
      summary: List persisted resume-request decisions for a visible relationship
      parameters:
        - { $ref: '#/components/parameters/CoachingPage' }
        - { $ref: '#/components/parameters/CoachingSize' }
      responses:
        '200': { $ref: '#/components/responses/CoachingResumePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
    post:
      tags: [Coaching Lifecycle]
      operationId: createCoachingResumeRequest
      summary: Either participant requests bilateral resumption while paused
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingActionRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/CoachingOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingConflict' }
  /coaching/relationships/{relationshipId}/resume-requests/{resumeRequestId}/{action}:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
      - { name: resumeRequestId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [accept, reject, cancel] } }
    post:
      tags: [Coaching Lifecycle]
      operationId: decideCoachingResumeRequest
      summary: Counterparty accepts/rejects or initiator cancels a pending resume request
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingResumeActionRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/CoachingOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingConflict' }
  /coaching/relationships/{relationshipId}/sharing-permissions:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
    get:
      tags: [Coaching Data Sharing]
      operationId: listCoachingSharingPermissions
      summary: List append-only sharing-decision history visible to a current participant
      description: A former Trainer cannot use this endpoint after the relationship ends; the relationship is concealed as 404.
      parameters:
        - { $ref: '#/components/parameters/CoachingPage' }
        - { $ref: '#/components/parameters/CoachingSize' }
      responses:
        '200': { $ref: '#/components/responses/CoachingSharingPermissionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
    post:
      tags: [Coaching Data Sharing]
      operationId: grantOrReplaceCoachingSharingPermission
      summary: Student grants, denies, or replaces one scoped sharing decision
      description: >-
        Only the Student owner may mutate sharing. Relationship and Coaching Period alone grant no data
        authority. expectedPermissionVersion is omitted for the first effective decision and is required
        when replacing one. Exact actor-scoped command-key replay returns the recorded result.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingSharingGrantRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/CoachingSharingPermission' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingSharingConflict' }
  /coaching/relationships/{relationshipId}/sharing-permissions/summary:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
    get:
      tags: [Coaching Data Sharing]
      operationId: getCoachingSharingPermissionSummary
      summary: Get the authoritative current sharing presentation for every supported scope
      description: >-
        The backend selects the latest decision and classifies replacement, revocation, and expiry.
        Relationship status remains a separate authority input. A former Trainer cannot read this
        summary after the relationship ends.
      responses:
        '200':
          description: Authoritative sharing presentation summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachingSharingPermissionSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingSharingConcealed' }
  /coaching/relationships/{relationshipId}/sharing-permissions/{permissionId}/revoke:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
      - { $ref: '#/components/parameters/CoachingSharingPermissionId' }
    post:
      tags: [Coaching Data Sharing]
      operationId: revokeCoachingSharingPermission
      summary: Student revokes an effective sharing decision without deleting its history
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingSharingRevokeRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/CoachingSharingPermission' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingSharingConcealed' }
        '409': { $ref: '#/components/responses/CoachingSharingConflict' }
  /exercises:
    get:
      tags: [Exercise Catalog]
      operationId: searchExercises
      summary: Search and filter active Exercises
      description: >-
        Returns only ACTIVE, non-deleted Exercises and active variations. Values repeated within
        one filter dimension are combined with OR; different filter dimensions are combined with
        AND. Search is a case-insensitive literal substring match over Exercise name, code,
        description, and active Variation name/code. Results use deterministic ordering by
        case-insensitive Exercise name ascending, then Exercise ID ascending. DRAFT and ARCHIVED
        content is never returned by this endpoint.
      parameters:
        - name: query
          in: query
          description: Literal substring to search; `%` and `_` are treated as ordinary characters.
          schema: { type: string, maxLength: 120 }
        - name: categoryCodes
          in: query
          description: Category codes; multiple values are ORed.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 60 }
        - name: muscleGroupCodes
          in: query
          description: Muscle-group codes; multiple values are ORed across active Variations.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 60 }
        - name: equipmentCodes
          in: query
          description: Equipment codes; multiple values are ORed across active Variations.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 60 }
        - name: tagCodes
          in: query
          description: Exercise tag codes; multiple values are ORed.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 80 }
        - name: difficulties
          in: query
          description: Exercise difficulty values; multiple values are ORed.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { $ref: '#/components/schemas/ExerciseDifficulty' }
        - name: movementPatterns
          in: query
          description: Movement-pattern values from filter metadata; multiple values are ORed.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 60 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated active Exercise catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseCatalogPageResponse' }
              example:
                items:
                  - id: 10000000-0000-0000-0000-000000000001
                    code: SYNTH_BODYWEIGHT_SQUAT
                    name: Synthetic Bodyweight Squat
                    category: { code: STRENGTH, name: Strength }
                    description: Synthetic lower-body exercise for development testing.
                    difficulty: BEGINNER
                    movementPattern: SQUAT
                    unilateral: false
                    primaryMuscles:
                      - { code: QUADRICEPS, name: Quadriceps }
                    equipment:
                      - { code: BODYWEIGHT, name: Bodyweight }
                    tags:
                      - { code: BEGINNER_FRIENDLY, name: Beginner Friendly }
                    variationCount: 1
                    mediaAvailable: false
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Authenticated User does not have Student or Trainer capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /exercises/filter-metadata:
    get:
      tags: [Exercise Catalog]
      operationId: getExerciseFilterMetadata
      summary: Get filter metadata for the active Exercise catalog
      description: >-
        Returns only categories, muscle groups, equipment, tags, difficulties, and movement
        patterns currently connected to ACTIVE, non-deleted Exercises through active Variations
        where applicable.
      responses:
        '200':
          description: Filter metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseFilterMetadataResponse' }
              example:
                categories:
                  - { code: STRENGTH, name: Strength }
                muscleGroups:
                  - { code: QUADRICEPS, name: Quadriceps, parentCode: null }
                equipment:
                  - { code: BODYWEIGHT, name: Bodyweight }
                tags:
                  - { code: BEGINNER_FRIENDLY, name: Beginner Friendly }
                difficulties: [BEGINNER]
                movementPatterns: [SQUAT]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Authenticated User does not have Student or Trainer capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /exercises/{exerciseId}:
    get:
      tags: [Exercise Catalog]
      operationId: getExerciseDetail
      summary: Get an active Exercise detail
      description: >-
        Returns an ACTIVE, non-deleted Exercise with active Variations, muscles, equipment,
        guidance, tags, and media metadata/reference. Storage bucket, object key, download URL,
        and presigned URL are not exposed. A missing, DRAFT, or ARCHIVED Exercise
        returns the same 404 behavior to avoid resource enumeration.
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active Exercise detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseDetailResponse' }
              example:
                id: 10000000-0000-0000-0000-000000000001
                code: SYNTH_BODYWEIGHT_SQUAT
                name: Synthetic Bodyweight Squat
                category: { code: STRENGTH, name: Strength }
                description: Synthetic lower-body exercise for development testing.
                instructions: Keep a stable stance and move through a comfortable range.
                difficulty: BEGINNER
                movementPattern: SQUAT
                unilateral: false
                variations:
                  - id: 20000000-0000-0000-0000-000000000001
                    code: SYNTH_BODYWEIGHT_SQUAT_STANDARD
                    name: Synthetic Bodyweight Squat - Standard
                    description: Standard synthetic variation.
                    instructions: Keep a stable stance and controlled tempo.
                    difficulty: BEGINNER
                    defaultVariation: true
                    muscles:
                      - { code: QUADRICEPS, name: Quadriceps, involvement: PRIMARY }
                    equipment:
                      - { code: BODYWEIGHT, name: Bodyweight, requirement: REQUIRED }
                    media: []
                tags:
                  - { code: BEGINNER_FRIENDLY, name: Beginner Friendly }
                guidance: []
                mediaAvailable: false
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Authenticated User does not have Student or Trainer capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Exercise does not exist or is not visible in the active catalog (EXERCISE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/exercises:
    get:
      tags: [Admin Exercise Catalog]
      operationId: searchAdminExercises
      summary: Search Exercises across every lifecycle state
      description: >
        Requires an active ADMIN role and CATALOG_MANAGE permission. Results are ordered by
        case-insensitive name, then ID. Muscle/equipment codes and safe media availability are
        resolved without exposing storage references or multiplying Exercise rows.
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExerciseLifecycleStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated governed Exercise catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExercisePageResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: CATALOG_MANAGE permission is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Admin Exercise Catalog]
      operationId: createAdminExerciseDraft
      summary: Create a DRAFT Exercise
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminExerciseDraftRequest' }
      responses:
        '201':
          description: Exercise draft created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExerciseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '409':
          description: Exercise code conflict (EXERCISE_CODE_CONFLICT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/exercises/metadata:
    get:
      tags: [Admin Exercise Catalog]
      operationId: getAdminExerciseFormMetadata
      summary: Get selectable metadata for Admin Exercise create and edit forms
      description: Requires an active ADMIN role and CATALOG_MANAGE permission. Inactive equipment, tags, and movement patterns are omitted.
      responses:
        '200':
          description: Deterministically ordered form metadata; every collection is present even when empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExerciseFormMetadataResponse' }
              examples:
                populated:
                  value:
                    categories: [{ code: STRENGTH, name: Strength }]
                    muscleGroups: [{ code: CORE, name: Core, parentCode: null }]
                    equipment: [{ code: BODYWEIGHT, name: Bodyweight }]
                    tags: [{ code: COMPOUND, name: Compound }]
                    difficulties: [BEGINNER, INTERMEDIATE, ADVANCED]
                    movementPatterns: [{ code: SQUAT, name: Squat }]
                emptyCatalogs:
                  value:
                    categories: []
                    muscleGroups: []
                    equipment: []
                    tags: []
                    difficulties: [BEGINNER, INTERMEDIATE, ADVANCED]
                    movementPatterns: []
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }

  /admin/exercises/{exerciseId}:
    parameters:
      - name: exerciseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin Exercise Catalog]
      operationId: getAdminExerciseDetail
      summary: Get governed Exercise detail in any lifecycle state
      responses:
        '200':
          description: Exercise detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExerciseResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404':
          description: Exercise not found (ADMIN_EXERCISE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Admin Exercise Catalog]
      operationId: updateAdminExerciseDraft
      summary: Replace editable content of a DRAFT Exercise
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminExerciseRequest' }
      responses:
        '200':
          description: Updated Exercise draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExerciseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404':
          description: Exercise not found (ADMIN_EXERCISE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Lifecycle, version, or code conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/exercises/{exerciseId}/activate:
    post:
      tags: [Admin Exercise Catalog]
      operationId: activateAdminExercise
      summary: Activate a complete DRAFT Exercise
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExerciseVersionRequest' }
      responses:
        '200':
          description: Activated Exercise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExerciseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { description: Exercise not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Lifecycle or version conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /admin/exercises/{exerciseId}/archive:
    post:
      tags: [Admin Exercise Catalog]
      operationId: archiveAdminExercise
      summary: Archive an ACTIVE Exercise
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveExerciseRequest' }
      responses:
        '200': { description: Archived Exercise, content: { application/json: { schema: { $ref: '#/components/schemas/AdminExerciseResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { description: Exercise not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Lifecycle, canonical-target, or version conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /admin/exercises/{exerciseId}/canonical-replacement:
    put:
      tags: [Admin Exercise Catalog]
      operationId: setAdminExerciseCanonicalReplacement
      summary: Set, change, or clear an archived Exercise canonical replacement
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanonicalReplacementRequest' }
      responses:
        '200': { description: Updated canonical replacement metadata, content: { application/json: { schema: { $ref: '#/components/schemas/AdminExerciseResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { description: Source or target Exercise not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Canonical, lifecycle, or version conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /admin/exercises/{exerciseId}/canonical-replacement/preview:
    get:
      tags: [Admin Exercise Catalog]
      operationId: previewAdminExerciseCanonicalReplacement
      summary: Preview canonical replacement metadata for an archived Exercise
      description: Usage impact is explicitly unavailable until historical B04/B05 consumers are implemented; unavailable counts are null, never zero.
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Read-only canonical replacement preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalReplacementPreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { description: Source Exercise not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Source lifecycle or canonical mapping conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/registrations:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register one common User Account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and email verification required
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/email-verifications/confirmations:
    post:
      tags: [Authentication]
      operationId: confirmEmail
      summary: Confirm a registered email using a one-time token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
      responses:
        '204': { description: Email confirmed }
        '400':
          $ref: '#/components/responses/InvalidOrExpiredOneTimeToken'
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an authenticated session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountUnavailable'
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Authentication]
      operationId: logoutCurrentSession
      summary: Revoke the current refresh-token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204': { description: Session revoked or already inactive }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/token-refreshes:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new token pair
      description: >-
        The presented refresh token is invalidated when rotation succeeds.
        Reuse of a revoked/replaced token is rejected and audited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '429': { $ref: '#/components/responses/RateLimited' }

  /users/me:
    get:
      tags: [Current User]
      operationId: getCurrentUser
      summary: Get the authenticated User and activated capabilities
      responses:
        '200':
          description: Current User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Current User]
      operationId: updateCurrentUser
      summary: Update mutable account preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Updated User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /student-profiles:
    post:
      tags: [Student Profile]
      operationId: createStudentProfile
      summary: Activate the Student capability on the current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertStudentProfileRequest'
      responses:
        '201':
          description: Student Profile created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '409':
          description: >-
            Conflict — Student profile already exists (STUDENT_PROFILE_ALREADY_EXISTS)
            or Student capability has been revoked (STUDENT_CAPABILITY_REVOKED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student-profiles/me:
    get:
      tags: [Student Profile]
      operationId: getMyStudentProfile
      summary: Get the current User's Student Profile
      responses:
        '200':
          description: Student Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Student capability is not active (STUDENT_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
    patch:
      tags: [Student Profile]
      operationId: updateMyStudentProfile
      summary: Update the current User's Student Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertStudentProfileRequest'
      responses:
        '200':
          description: Updated Student Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Student capability is not active (STUDENT_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }

  /trainer-profiles:
    post:
      tags: [Trainer Profile]
      operationId: createTrainerProfile
      summary: Create a Trainer Profile without granting coaching authority
      description: >-
        Coaching authority remains unavailable until verification, activity,
        and applicable policy conditions are all satisfied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainerProfileRequest'
      responses:
        '201':
          description: Trainer Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '409':
          description: >-
            Conflict — Trainer Profile already exists (TRAINER_PROFILE_ALREADY_EXISTS),
            public slug is already in use (TRAINER_SLUG_ALREADY_EXISTS),
            or Trainer capability has been revoked (TRAINER_CAPABILITY_REVOKED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trainer-profiles/me:
    get:
      tags: [Trainer Profile]
      operationId: getMyTrainerProfile
      summary: Get the current User's Trainer Profile and eligibility state
      responses:
        '200':
          description: Trainer Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerProfileResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
    patch:
      tags: [Trainer Profile]
      operationId: updateMyTrainerProfile
      summary: Update mutable Trainer Profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainerProfileRequest'
      responses:
        '200':
          description: Updated Trainer Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '409':
          description: Conflict — Public slug is already in use by another trainer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trainer-applications:
    post:
      tags: [Trainer Application]
      operationId: submitTrainerApplication
      summary: Submit the current Trainer Profile for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTrainerApplicationRequest'
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden - Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: A Trainer Profile must exist first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: An active application already exists or the transition is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trainer-applications/me/current:
    get:
      tags: [Trainer Application]
      operationId: getMyCurrentTrainerApplication
      summary: Get the current Trainer Application
      responses:
        '200':
          description: Current application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerApplicationResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden - Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No Trainer Application exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/trainer-applications:
    get:
      tags: [Admin Trainer Verification]
      operationId: getAdminTrainerApplications
      summary: List trainer verification applications for administrative review
      description: >-
        Lists applications filtered by status (defaults to PENDING queue) with
        deterministic sorting (submitted_at ASC, id ASC) and pagination.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TrainerVerificationStatus'
          description: Filter applications by verification status. Defaults to PENDING if omitted.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based page index.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (maximum 100).
      responses:
        '200':
          description: Page of trainer applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrainerApplicationPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or User lacks active ADMIN role (ACCESS_DENIED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/trainer-applications/{applicationId}:
    get:
      tags: [Admin Trainer Verification]
      operationId: getAdminTrainerApplicationDetail
      summary: Get detailed trainer application view including confidential review notes
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the trainer application.
      responses:
        '200':
          description: Detailed trainer application view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrainerApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or User lacks active ADMIN role (ACCESS_DENIED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Application not found (TRAINER_APPLICATION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/trainer-applications/{applicationId}/decisions:
    post:
      tags: [Admin Trainer Verification]
      operationId: decideTrainerApplication
      summary: Approve or reject a pending trainer application
      description: >-
        Transitions a PENDING application to VERIFIED or REJECTED. Updates trainer
        profile verification status and timestamps, appends status history, and
        records an audit entry.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the trainer application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideTrainerApplicationRequest'
      responses:
        '200':
          description: Application decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrainerApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or User lacks active ADMIN role (ACCESS_DENIED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Application not found (TRAINER_APPLICATION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: >-
            Conflict — Application is not in PENDING state, has already been decided
            (TRAINER_APPLICATION_ALREADY_DECIDED), or trainer profile is not in PENDING state (INVALID_LIFECYCLE_TRANSITION).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goals:
    get:
      tags: [Fitness Goal]
      operationId: getStudentFitnessGoals
      summary: List fitness goals for the authenticated student
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GoalLifecycleStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of fitness goals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
    post:
      tags: [Fitness Goal]
      operationId: createFitnessGoal
      summary: Create a student fitness goal
      description: >-
        Creates a new Student-owned Fitness Goal with version, objectives, and targets.
        Can be initialized in DRAFT or ACTIVE state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFitnessGoalRequest'
      responses:
        '201':
          description: Fitness goal created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '409':
          $ref: '#/components/responses/ActiveFitnessGoalAlreadyExists'

  /fitness-goals/me/current:
    get:
      tags: [Fitness Goal]
      operationId: getCurrentFitnessGoal
      summary: Get current active or manageable fitness goal for the authenticated student
      parameters:
        - name: includePaused
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, returns the active goal if present, or the most recent paused goal if no active goal exists.
      responses:
        '200':
          description: Current active or paused fitness goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }

  /fitness-goals/{goalId}:
    get:
      tags: [Fitness Goal]
      operationId: getFitnessGoalDetail
      summary: Get fitness goal details by ID
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fitness goal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }

  /fitness-goals/{goalId}/activate:
    post:
      tags: [Fitness Goal]
      operationId: activateFitnessGoal
      summary: Activate a draft fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateFitnessGoalRequest'
      responses:
        '200':
          description: Fitness goal activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /fitness-goals/{goalId}/pause:
    post:
      tags: [Fitness Goal]
      operationId: pauseFitnessGoal
      summary: Pause an active fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseFitnessGoalRequest'
      responses:
        '200':
          description: Fitness goal paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Only owning student may pause personal fitness goal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Fitness goal or student profile not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflict - Goal is not in ACTIVE status or concurrent modification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goals/{goalId}/resume:
    post:
      tags: [Fitness Goal]
      operationId: resumeFitnessGoal
      summary: Resume a paused fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeFitnessGoalRequest'
      responses:
        '200':
          description: Fitness goal resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Only owning student may resume personal fitness goal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Fitness goal or student profile not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflict - Goal is not in PAUSED status, active goal already exists, or concurrent modification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goals/{goalId}/versions:
    get:
      tags: [Fitness Goal]
      operationId: getGoalVersions
      summary: List version history for a fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated goal versions ordered newest to oldest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalVersionPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
    post:
      tags: [Fitness Goal]
      operationId: createGoalVersion
      summary: Create a new same-journey version for an active fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalVersionRequest'
      responses:
        '201':
          description: Goal version created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalVersionResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
        '409':
          description: >-
            Conflict - Goal version conflict or concurrent modification (GOAL_VERSION_CONFLICT),
            new goal journey required (NEW_GOAL_JOURNEY_REQUIRED),
            no changes detected (GOAL_VERSION_NO_CHANGES),
            or invalid lifecycle transition (INVALID_LIFECYCLE_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fitness-goals/{goalId}/versions/{versionId}:
    get:
      tags: [Fitness Goal]
      operationId: getGoalVersionDetail
      summary: Get details of a specific fitness goal version
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Goal version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalVersionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/GoalVersionNotFound' }

  /fitness-goals/{goalId}/transitions:
    get:
      tags: [Fitness Goal]
      operationId: getGoalTransitions
      summary: List transition history for a fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of goal transitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalTransitionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
    post:
      tags: [Fitness Goal]
      operationId: createGoalTransition
      summary: Transition an active fitness goal to a new journey
      description: >-
        Transitions an active fitness goal to REPLACED and creates a new goal starting at Version 1
        with a different PRIMARY goal type, preserving all history.
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalTransitionRequest'
      responses:
        '201':
          description: Goal transition created and new goal activated
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalTransitionResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
        '409':
          description: >-
            Conflict - Same goal journey not permitted (SAME_GOAL_JOURNEY_NOT_PERMITTED),
            goal transition conflict (GOAL_TRANSITION_CONFLICT),
            or invalid lifecycle transition (INVALID_LIFECYCLE_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fitness-goals/{goalId}/transitions/{transitionId}:
    get:
      tags: [Fitness Goal]
      operationId: getGoalTransitionDetail
      summary: Get details of a specific goal transition
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: transitionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Goal transition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalTransitionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Goal transition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fitness-goals/{goalId}/proposals:
    post:
      tags: [Fitness Goal Proposal]
      operationId: createGoalProposal
      summary: Create a goal proposal for an active student fitness goal
      description: >-
        Allows an authorized, eligible Trainer with an active coaching relationship,
        active human coaching period, and active FITNESS_GOAL sharing permission at
        CONTRIBUTE or MANAGE to propose modifications to an active fitness goal.
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalProposalRequest'
      responses:
        '201':
          description: Goal proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden codes include TRAINER_NOT_ELIGIBLE, COACHING_RELATIONSHIP_REQUIRED,
            DATA_SHARING_PERMISSION_REQUIRED, and DATA_SHARING_ACCESS_LEVEL_INSUFFICIENT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
        '409':
          description: Conflict - Fitness goal is not in ACTIVE status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goal-proposals/me:
    get:
      tags: [Fitness Goal Proposal]
      operationId: getMyGoalProposals
      summary: List fitness goal proposals for the authenticated student
      parameters:
        - name: fitnessGoalId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProposalStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of goal proposals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }

  /fitness-goal-proposals/{proposalId}:
    get:
      tags: [Fitness Goal Proposal]
      operationId: getGoalProposalDetail
      summary: Get goal proposal detail with current-versus-proposed comparison data
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Goal proposal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden - requester is not the proposal Student or creator Trainer, or the creator
            Trainer lacks current FITNESS_GOAL VIEW authority. Codes include
            GOAL_PROPOSAL_ACCESS_DENIED, TRAINER_NOT_ELIGIBLE, COACHING_RELATIONSHIP_REQUIRED,
            DATA_SHARING_PERMISSION_REQUIRED, and DATA_SHARING_ACCESS_LEVEL_INSUFFICIENT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Goal proposal not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goal-proposals/{proposalId}/decisions:
    post:
      tags: [Fitness Goal Proposal]
      operationId: decideGoalProposal
      summary: Accept or reject a fitness goal proposal
      description: >-
        Allows the owning student to ACCEPT or REJECT a pending goal proposal.
        ACCEPT atomically creates a new same-journey fitness goal version (if primary goal type matches)
        or transitions the previous goal to REPLACED and creates a new goal starting at Version 1 (if primary goal type changes).
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideGoalProposalRequest'
      responses:
        '200':
          description: Goal proposal decided successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '400':
          description: Bad Request - Invalid decision format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Only owning student may decide personal goal proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Goal proposal not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: >-
            Conflict - Goal proposal already decided (GOAL_PROPOSAL_ALREADY_DECIDED),
            expired (GOAL_PROPOSAL_EXPIRED), base goal version is stale (STALE_GOAL_PROPOSAL),
            proposed primary goal type differs from base journey (NEW_GOAL_JOURNEY_REQUIRED),
            or proposed version contains no changes (GOAL_VERSION_NO_CHANGES).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workout-plans:
    get:
      tags: [Workout Plan]
      operationId: listVisibleWorkoutPlans
      summary: List actor-visible Workout Plans
      description: >-
        A Student lists their own plans. A Trainer must retain current WORKOUT_PLAN VIEW authority;
        historical items additionally require WORKOUT_PLAN_HISTORY VIEW. Former Trainers and unrelated
        actors receive no recoverable plan history.
      parameters:
        - name: studentId
          in: query
          schema: { type: string, format: uuid }
          description: Defaults to the authenticated actor; Trainers use it to select the current Student.
        - { $ref: '#/components/parameters/WorkoutPlanPage' }
        - { $ref: '#/components/parameters/WorkoutPlanSize' }
      responses:
        '200':
          description: Stable created-at descending page of visible plans
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanPage' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Workout Plan]
      operationId: createWorkoutPlanDraft
      summary: Create a Workout Plan draft
      description: SELF_DIRECTED Students create Student-owned drafts; the current HUMAN_COACH Trainer requires WORKOUT_PLAN MANAGE.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateWorkoutPlanDraftRequest' } } }
      responses:
        '201':
          description: Draft created
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /workout-plans/current:
    get:
      tags: [Workout Plan]
      operationId: getCurrentWorkoutPlan
      summary: Get the Student's ACTIVE Workout Plan
      parameters:
        - name: studentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Current ACTIVE plan, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
  /workout-plans/{planId}:
    get:
      tags: [Workout Plan]
      operationId: getWorkoutPlan
      summary: Get an actor-visible Workout Plan
      parameters: [{ $ref: '#/components/parameters/WorkoutPlanId' }]
      responses:
        '200': { description: Plan detail, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
  /workout-plans/{planId}/draft:
    put:
      tags: [Workout Plan]
      operationId: updateWorkoutPlanDraft
      summary: Replace the editable DRAFT snapshot
      parameters: [{ $ref: '#/components/parameters/WorkoutPlanId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWorkoutPlanDraftRequest' } } }
      responses:
        '200': { description: Draft replaced, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /workout-plans/{planId}/activate:
    post:
      tags: [Workout Plan]
      operationId: activateWorkoutPlan
      summary: Activate the initial locked version using the DB timestamp
      parameters: [{ $ref: '#/components/parameters/WorkoutPlanId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanVersionedCommandRequest' } } }
      responses:
        '200': { description: Plan activated, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /workout-plans/{planId}/transitions:
    post:
      tags: [Workout Plan]
      operationId: transitionWorkoutPlan
      summary: Apply one approved lifecycle transition
      description: Invalid edges and every transition out of ARCHIVED return WORKOUT_PLAN_LIFECYCLE_CONFLICT.
      parameters: [{ $ref: '#/components/parameters/WorkoutPlanId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransitionWorkoutPlanRequest' } } }
      responses:
        '200': { description: Lifecycle transitioned, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /workout-plans/{planId}/versions:
    get:
      tags: [Workout Plan]
      operationId: listWorkoutPlanVersions
      summary: List visible immutable version history
      parameters:
        - { $ref: '#/components/parameters/WorkoutPlanId' }
        - { $ref: '#/components/parameters/WorkoutPlanPage' }
        - { $ref: '#/components/parameters/WorkoutPlanSize' }
      responses:
        '200': { description: Version-number descending page, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanVersionPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
    post:
      tags: [Workout Plan]
      operationId: publishWorkoutPlanVersion
      summary: Atomically publish a significant complete replacement version
      description: >-
        Uses one authoritative DB boundary to close the previous version and open the immutable successor.
        Already-materialized Planned Workouts are never rewritten. No client effective timestamp is accepted.
      parameters: [{ $ref: '#/components/parameters/WorkoutPlanId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishWorkoutPlanVersionRequest' } } }
      responses:
        '201':
          description: Version published
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /workout-plans/{planId}/versions/{versionId}:
    get:
      tags: [Workout Plan]
      operationId: getWorkoutPlanVersion
      summary: Get one visible version with sessions and prescriptions
      description: Archived Exercise references retain historical presentation and canonical replacement metadata when available.
      parameters:
        - { $ref: '#/components/parameters/WorkoutPlanId' }
        - { $ref: '#/components/parameters/WorkoutPlanVersionId' }
      responses:
        '200': { description: Version detail, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanVersionDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
  /workout-plans/successors:
    post:
      tags: [Workout Plan]
      operationId: createStudentWorkoutPlanSuccessor
      summary: Create a Student-owned SELF_DIRECTED successor from a Trainer-delivered locked version
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateWorkoutPlanSuccessorRequest' } } }
      responses:
        '201':
          description: Successor draft created with explicit lineage
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }

  /planned-workout-series:
    get:
      tags: [Workout Schedule]
      operationId: listMyPlannedWorkoutSeries
      summary: List the authenticated Student's recurring Planned Workout series
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeriesStatus' } }
        - { $ref: '#/components/parameters/WorkoutSchedulePage' }
        - { $ref: '#/components/parameters/WorkoutScheduleSize' }
      responses:
        '200': { description: Created-at descending series page, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeriesPage' } } } }
        '400': { $ref: '#/components/responses/WorkoutScheduleValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutScheduleForbidden' }
    post:
      tags: [Workout Schedule]
      operationId: confirmPlannedWorkoutSeries
      summary: Student confirms a published-version recurring series
      description: >-
        Student confirms one Monday anchor, IANA timezone and selected source sessions. The source published
        version is checked at confirmation. A series does not create an Appointment or an occurrence immediately;
        the daily PostgreSQL-time materializer processes eligible starts in [now, now + 30 days).
        Matching actor commandKey and payload replay; different payload conflicts.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeriesCreate' } } }
      responses:
        '201': { description: Confirmed series or idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeries' } } } }
        '400': { $ref: '#/components/responses/WorkoutScheduleValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutScheduleForbidden' }
        '404': { $ref: '#/components/responses/WorkoutScheduleConcealed' }
        '409': { $ref: '#/components/responses/WorkoutScheduleConflict' }

  /students/{studentId}/planned-workout-series:
    get:
      tags: [Workout Schedule]
      operationId: listMyProposedWorkoutSeriesForStudent
      summary: List this Trainer's own series proposals for one Student
      description: Current WORKOUT_PLAN VIEW and effective Coaching Period are required before count or page queries.
      parameters:
        - { $ref: '#/components/parameters/WorkoutScheduleStudentId' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeriesStatus' } }
        - { $ref: '#/components/parameters/WorkoutSchedulePage' }
        - { $ref: '#/components/parameters/WorkoutScheduleSize' }
      responses:
        '200': { description: Own proposals only, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeriesPage' } } } }
        '400': { $ref: '#/components/responses/WorkoutScheduleValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutScheduleConcealed' }
    post:
      tags: [Workout Schedule]
      operationId: proposePlannedWorkoutSeries
      summary: Trainer proposes a series; only the Student can confirm it
      description: >-
        Requires current WORKOUT_PLAN CONTRIBUTE for this Student and records the exact Coaching Period.
        PENDING creates no occurrences. ACCEPT later rechecks Trainer authority, period, plan version and payload.
      parameters: [{ $ref: '#/components/parameters/WorkoutScheduleStudentId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeriesCreate' } } }
      responses:
        '201': { description: Pending proposal or idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeries' } } } }
        '400': { $ref: '#/components/responses/WorkoutScheduleValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutScheduleForbidden' }
        '404': { $ref: '#/components/responses/WorkoutScheduleConcealed' }
        '409': { $ref: '#/components/responses/WorkoutScheduleConflict' }

  /planned-workout-series/{seriesId}:
    get:
      tags: [Workout Schedule]
      operationId: getPlannedWorkoutSeries
      summary: Read one Student-owned series or current proposing-Trainer proposal
      description: A former Trainer cannot read live series detail, including after a new Coaching Period begins.
      parameters: [{ name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Series detail, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeries' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutScheduleConcealed' }

  /planned-workout-series/{seriesId}/periods:
    get:
      tags: [Workout Schedule]
      operationId: listPlannedWorkoutSeriesPeriods
      summary: Read stable per-period materialization outcomes
      description: >-
        Results include DST ambiguity/gap and skipped conflict reasons without exposing another occurrence's
        identity or times. Student may schedule an unresolved period explicitly through the existing direct batch;
        the job never silently retries a recorded period. Trainer read requires current WORKOUT_PLAN VIEW.
      parameters:
        - { name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/WorkoutSchedulePage' }
        - { $ref: '#/components/parameters/WorkoutScheduleSize' }
      responses:
        '200': { description: Periods ordered by block iteration then source session ID, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrencePeriodPage' } } } }
        '400': { $ref: '#/components/responses/WorkoutScheduleValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutScheduleConcealed' }

  /planned-workout-series/{seriesId}/decisions:
    post:
      tags: [Workout Schedule]
      operationId: decidePlannedWorkoutSeriesProposal
      summary: Student accepts or rejects a pending Trainer series proposal
      description: ACCEPT rechecks source and current proposing-Trainer authority; REJECT remains available after authority loss.
      parameters: [{ name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeriesDecision' } } }
      responses:
        '200': { description: Versioned decision or idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeries' } } } }
        '400': { $ref: '#/components/responses/WorkoutScheduleValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutScheduleConcealed' }
        '409': { $ref: '#/components/responses/WorkoutScheduleConflict' }

  /planned-workout-series/{seriesId}/stop:
    post:
      tags: [Workout Schedule]
      operationId: stopPlannedWorkoutSeries
      summary: Student stops future automatic periods without changing past occurrences
      parameters: [{ name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeriesVersionCommand' } } }
      responses:
        '200': { description: Stopped series or idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutRecurrenceSeries' } } } }
        '400': { $ref: '#/components/responses/WorkoutScheduleValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutScheduleConcealed' }
        '409': { $ref: '#/components/responses/WorkoutScheduleConflict' }

  /planned-workout-series/{seriesId}/withdraw:
    post:
      tags: [Workout Schedule]
      operationId: withdrawPlannedWorkoutSeriesProposal
      summary: Proposing Trainer withdraws a pending series proposal
      description: Current WORKOUT_PLAN CONTRIBUTE and the original Coaching Period are required even on replay.
