        future, including when its source plan is PAUSED, COMPLETED, or ARCHIVED. The original source plan
        version/session/prescription and plan-week coordinates are retained even if the target moves to another
        day or week; no current plan publication is selected. Missing legacy source version/session or local
        intent, any linked Appointment, and COACH_REQUIRED supervision block this first flow. The backend
        resolves explicit local intent/offsets in the selected IANA timezone, requires target start strictly
        after PostgreSQL time and at most 90 days later, and rechecks unknown-end on other SCHEDULED rows, historical
        source-instant duplicate, and SCHEDULED-range overlap. V31 database constraints cover only batch-linked
        rows; the transaction must also guard conflicts with legacy rows, without assuming V31 protects them. The old
        row becomes RESCHEDULED and one new SCHEDULED occurrence points to it through rescheduledFromOccurrenceId;
        originalPlannedStartAt stays anchored across the chain. Source batch and accepted proposal stay unchanged.
        Authority and ownership are checked before receipt replay. Same actor, command type, key, and logical
        payload replay exactly one committed effect; key reuse with a different payload conflicts.
