openapi: 3.1.0
info:
  title: AI Integrated Personalized Online Fitness Coaching System API
  version: 0.1.0
  description: >-
    Executable REST contract for implemented platform capabilities. Spring Boot
    is the business authority. Creating a Trainer Profile or submitting a Trainer
    Application does not grant coaching authority.
  license:
    name: License decision pending
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Authentication
    description: Account registration, verification, authentication, session refresh, and logout operations.
  - name: Current User
    description: Profile query, settings management, and account details for the authenticated user.
  - name: Student Profile
    description: Student capability activation and profile management on the common account.
  - name: Trainer Profile
    description: Trainer capability activation and profile management on the common account.
  - name: Trainer Application
    description: Submission and status tracking for trainer verification applications.
  - name: Admin Trainer Verification
    description: Verification review, approval, and rejection of trainer applications by platform administrators.
  - name: Fitness Goal
    description: Student-owned fitness goal management, versioning, objectives, and measurable targets.
  - name: Coaching Lifecycle
    description: Student-Trainer relationship and minimal effective-period lifecycle.
  - name: Coaching Data Sharing
    description: Student-owned scoped sharing decisions and immutable decision history.
  - name: Exercise Catalog
    description: Authenticated Student and Trainer read access to the active Exercise catalog.
  - name: Admin Exercise Catalog
    description: Permission-protected Exercise draft, lifecycle, and canonical replacement management.
  - name: Workout Plan
    description: Actor-scoped Workout Plan authoring, lifecycle, immutable versions, and occurrence adjustments.

paths:
  /coaching/trainers:
    get:
      tags: [Coaching Lifecycle]
      operationId: searchDiscoverableTrainers
      summary: Browse eligible Trainers who are accepting Students
      description: Returns a privacy-minimal public projection. Eligibility and availability are filtered by the backend.
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 160, default: '' }
          description: Case-insensitive literal substring match on display name.
        - { $ref: '#/components/parameters/CoachingPage' }
        - { $ref: '#/components/parameters/CoachingSize' }
      responses:
        '200': { $ref: '#/components/responses/TrainerDirectoryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
  /coaching/students/lookup:
    get:
      tags: [Coaching Lifecycle]
      operationId: lookupStudentForCoachingInvitation
      summary: Resolve one Student by exact email for an eligible Trainer invitation
      description: >-
        Exact normalized lookup only; never returns a Student directory or partial matches.
        Missing, inactive, and unavailable Student targets share the same concealed 404 behavior.
        The response does not expose the matched email.
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email, maxLength: 320 }
      responses:
        '200':
          description: Privacy-minimal Student display summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentLookup' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
  /coaching/relationships/me:
    get:
      tags: [Coaching Lifecycle]
      operationId: listVisibleCoachingRelationships
      summary: List actor-visible relationships with privacy-safe counterparty summaries
      description: >-
        Students receive their own pending, active, paused, and terminal history. Trainers receive
        only currently visible pending, active, or paused relationships; former-Trainer terminal
        relationships remain concealed.
      parameters:
        - { $ref: '#/components/parameters/CoachingPage' }
        - { $ref: '#/components/parameters/CoachingSize' }
      responses:
        '200': { $ref: '#/components/responses/CoachingRelationshipPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
  /coaching/relationships/me/current:
    get:
      tags: [Coaching Lifecycle]
      operationId: getCurrentCoachingRelationship
      summary: Get the authenticated Student's current relationship and effective period
      responses:
        '200': { $ref: '#/components/responses/CoachingOutcome' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
  /coaching/relationships/me/pending:
    get:
      tags: [Coaching Lifecycle]
      operationId: listPendingCoachingRelationships
      summary: List incoming or outgoing pending requests/invitations for the authenticated participant
      parameters:
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/CoachingDirection' } }
        - { $ref: '#/components/parameters/CoachingPage' }
        - { $ref: '#/components/parameters/CoachingSize' }
      responses:
        '200': { $ref: '#/components/responses/CoachingRelationshipPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
  /coaching/relationships/{relationshipId}:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
    get:
      tags: [Coaching Lifecycle]
      operationId: getCoachingRelationship
      summary: Get a visible participant relationship and pending resume context
      responses:
        '200': { $ref: '#/components/responses/CoachingOutcome' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
  /coaching/relationships/{relationshipId}/history:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
    get:
      tags: [Coaching Lifecycle]
      operationId: listCoachingRelationshipHistory
      summary: List append-only status events for a visible relationship
      parameters:
        - { $ref: '#/components/parameters/CoachingPage' }
        - { $ref: '#/components/parameters/CoachingSize' }
      responses:
        '200': { $ref: '#/components/responses/CoachingHistoryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
  /coaching/periods/me:
    get:
      tags: [Coaching Lifecycle]
      operationId: listMyCoachingPeriods
      summary: List the authenticated Student's effective-period history
      parameters:
        - { $ref: '#/components/parameters/CoachingPage' }
        - { $ref: '#/components/parameters/CoachingSize' }
      responses:
        '200': { $ref: '#/components/responses/CoachingPeriodPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
  /coaching/relationships/requests:
    post:
      tags: [Coaching Lifecycle]
      operationId: requestCoachingRelationship
      summary: Student requests coaching from an eligible Trainer
      description: An exact command-key replay is subject to current participant visibility, not historical receipt visibility.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingInitiateRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/CoachingOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingConflict' }
  /coaching/relationships/invitations:
    post:
      tags: [Coaching Lifecycle]
      operationId: inviteStudentToCoaching
      summary: Eligible Trainer invites a Student
      description: A former Trainer cannot replay an invitation receipt after the relationship has ended; it is concealed as 404.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingInitiateRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/CoachingOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingConflict' }
  /coaching/relationships/{relationshipId}/{action}:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [accept, reject, cancel, pause, end] }
    post:
      tags: [Coaching Lifecycle]
      operationId: decideCoachingRelationship
      summary: Accept, reject, cancel, pause, or end according to participant and state rules
      description: >-
        End requires a nonblank reason; the command is the explicit end confirmation.
        A fresh successful End returns its result, but a former Trainer's later replay
        of any command receipt, including End, is concealed as 404. Student replay
        retains access to the saved result under current Student capability checks.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingActionRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/CoachingOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingConflict' }
  /coaching/relationships/{relationshipId}/resume-requests:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
    get:
      tags: [Coaching Lifecycle]
      operationId: listCoachingResumeRequests
      summary: List persisted resume-request decisions for a visible relationship
      parameters:
        - { $ref: '#/components/parameters/CoachingPage' }
        - { $ref: '#/components/parameters/CoachingSize' }
      responses:
        '200': { $ref: '#/components/responses/CoachingResumePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
    post:
      tags: [Coaching Lifecycle]
      operationId: createCoachingResumeRequest
      summary: Either participant requests bilateral resumption while paused
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingActionRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/CoachingOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingConflict' }
  /coaching/relationships/{relationshipId}/resume-requests/{resumeRequestId}/{action}:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
      - { name: resumeRequestId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [accept, reject, cancel] } }
    post:
      tags: [Coaching Lifecycle]
      operationId: decideCoachingResumeRequest
      summary: Counterparty accepts/rejects or initiator cancels a pending resume request
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingResumeActionRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/CoachingOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingConflict' }
  /coaching/relationships/{relationshipId}/sharing-permissions:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
    get:
      tags: [Coaching Data Sharing]
      operationId: listCoachingSharingPermissions
      summary: List append-only sharing-decision history visible to a current participant
      description: A former Trainer cannot use this endpoint after the relationship ends; the relationship is concealed as 404.
      parameters:
        - { $ref: '#/components/parameters/CoachingPage' }
        - { $ref: '#/components/parameters/CoachingSize' }
      responses:
        '200': { $ref: '#/components/responses/CoachingSharingPermissionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
    post:
      tags: [Coaching Data Sharing]
      operationId: grantOrReplaceCoachingSharingPermission
      summary: Student grants, denies, or replaces one scoped sharing decision
      description: >-
        Only the Student owner may mutate sharing. Relationship and Coaching Period alone grant no data
        authority. expectedPermissionVersion is omitted for the first effective decision and is required
        when replacing one. Exact actor-scoped command-key replay returns the recorded result.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingSharingGrantRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/CoachingSharingPermission' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingConcealed' }
        '409': { $ref: '#/components/responses/CoachingSharingConflict' }
  /coaching/relationships/{relationshipId}/sharing-permissions/summary:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
    get:
      tags: [Coaching Data Sharing]
      operationId: getCoachingSharingPermissionSummary
      summary: Get the authoritative current sharing presentation for every supported scope
      description: >-
        The backend selects the latest decision and classifies replacement, revocation, and expiry.
        Relationship status remains a separate authority input. A former Trainer cannot read this
        summary after the relationship ends.
      responses:
        '200':
          description: Authoritative sharing presentation summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachingSharingPermissionSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingSharingConcealed' }
  /coaching/relationships/{relationshipId}/sharing-permissions/{permissionId}/revoke:
    parameters:
      - { $ref: '#/components/parameters/CoachingRelationshipId' }
      - { $ref: '#/components/parameters/CoachingSharingPermissionId' }
    post:
      tags: [Coaching Data Sharing]
      operationId: revokeCoachingSharingPermission
      summary: Student revokes an effective sharing decision without deleting its history
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachingSharingRevokeRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/CoachingSharingPermission' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CoachingForbidden' }
        '404': { $ref: '#/components/responses/CoachingSharingConcealed' }
        '409': { $ref: '#/components/responses/CoachingSharingConflict' }
  /exercises:
    get:
      tags: [Exercise Catalog]
      operationId: searchExercises
      summary: Search and filter active Exercises
      description: >-
        Returns only ACTIVE, non-deleted Exercises and active variations. Values repeated within
        one filter dimension are combined with OR; different filter dimensions are combined with
        AND. Search is a case-insensitive literal substring match over Exercise name, code,
        description, and active Variation name/code. Results use deterministic ordering by
        case-insensitive Exercise name ascending, then Exercise ID ascending. DRAFT and ARCHIVED
        content is never returned by this endpoint.
      parameters:
        - name: query
          in: query
          description: Literal substring to search; `%` and `_` are treated as ordinary characters.
          schema: { type: string, maxLength: 120 }
        - name: categoryCodes
          in: query
          description: Category codes; multiple values are ORed.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 60 }
        - name: muscleGroupCodes
          in: query
          description: Muscle-group codes; multiple values are ORed across active Variations.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 60 }
        - name: equipmentCodes
          in: query
          description: Equipment codes; multiple values are ORed across active Variations.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 60 }
        - name: tagCodes
          in: query
          description: Exercise tag codes; multiple values are ORed.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 80 }
        - name: difficulties
          in: query
          description: Exercise difficulty values; multiple values are ORed.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { $ref: '#/components/schemas/ExerciseDifficulty' }
        - name: movementPatterns
          in: query
          description: Movement-pattern values from filter metadata; multiple values are ORed.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 60 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated active Exercise catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseCatalogPageResponse' }
              example:
                items:
                  - id: 10000000-0000-0000-0000-000000000001
                    code: SYNTH_BODYWEIGHT_SQUAT
                    name: Synthetic Bodyweight Squat
                    category: { code: STRENGTH, name: Strength }
                    description: Synthetic lower-body exercise for development testing.
                    difficulty: BEGINNER
                    movementPattern: SQUAT
                    unilateral: false
                    primaryMuscles:
                      - { code: QUADRICEPS, name: Quadriceps }
                    equipment:
                      - { code: BODYWEIGHT, name: Bodyweight }
                    tags:
                      - { code: BEGINNER_FRIENDLY, name: Beginner Friendly }
                    variationCount: 1
                    mediaAvailable: false
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Authenticated User does not have Student or Trainer capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /exercises/filter-metadata:
    get:
      tags: [Exercise Catalog]
      operationId: getExerciseFilterMetadata
      summary: Get filter metadata for the active Exercise catalog
      description: >-
        Returns only categories, muscle groups, equipment, tags, difficulties, and movement
        patterns currently connected to ACTIVE, non-deleted Exercises through active Variations
        where applicable.
      responses:
        '200':
          description: Filter metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseFilterMetadataResponse' }
              example:
                categories:
                  - { code: STRENGTH, name: Strength }
                muscleGroups:
                  - { code: QUADRICEPS, name: Quadriceps, parentCode: null }
                equipment:
                  - { code: BODYWEIGHT, name: Bodyweight }
                tags:
                  - { code: BEGINNER_FRIENDLY, name: Beginner Friendly }
                difficulties: [BEGINNER]
                movementPatterns: [SQUAT]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Authenticated User does not have Student or Trainer capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /exercises/{exerciseId}:
    get:
      tags: [Exercise Catalog]
      operationId: getExerciseDetail
      summary: Get an active Exercise detail
      description: >-
        Returns an ACTIVE, non-deleted Exercise with active Variations, muscles, equipment,
        guidance, tags, and media metadata/reference. Storage bucket, object key, download URL,
        and presigned URL are not exposed. A missing, DRAFT, or ARCHIVED Exercise
        returns the same 404 behavior to avoid resource enumeration.
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active Exercise detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseDetailResponse' }
              example:
                id: 10000000-0000-0000-0000-000000000001
                code: SYNTH_BODYWEIGHT_SQUAT
                name: Synthetic Bodyweight Squat
                category: { code: STRENGTH, name: Strength }
                description: Synthetic lower-body exercise for development testing.
                instructions: Keep a stable stance and move through a comfortable range.
                difficulty: BEGINNER
                movementPattern: SQUAT
                unilateral: false
                variations:
                  - id: 20000000-0000-0000-0000-000000000001
                    code: SYNTH_BODYWEIGHT_SQUAT_STANDARD
                    name: Synthetic Bodyweight Squat - Standard
                    description: Standard synthetic variation.
                    instructions: Keep a stable stance and controlled tempo.
                    difficulty: BEGINNER
                    defaultVariation: true
                    muscles:
                      - { code: QUADRICEPS, name: Quadriceps, involvement: PRIMARY }
                    equipment:
                      - { code: BODYWEIGHT, name: Bodyweight, requirement: REQUIRED }
                    media: []
                tags:
                  - { code: BEGINNER_FRIENDLY, name: Beginner Friendly }
                guidance: []
                mediaAvailable: false
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Authenticated User does not have Student or Trainer capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Exercise does not exist or is not visible in the active catalog (EXERCISE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/exercises:
    get:
      tags: [Admin Exercise Catalog]
      operationId: searchAdminExercises
      summary: Search Exercises across every lifecycle state
      description: >
        Requires an active ADMIN role and CATALOG_MANAGE permission. Results are ordered by
        case-insensitive name, then ID. Muscle/equipment codes and safe media availability are
        resolved without exposing storage references or multiplying Exercise rows.
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExerciseLifecycleStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated governed Exercise catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExercisePageResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: CATALOG_MANAGE permission is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Admin Exercise Catalog]
      operationId: createAdminExerciseDraft
      summary: Create a DRAFT Exercise
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminExerciseDraftRequest' }
      responses:
        '201':
          description: Exercise draft created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExerciseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '409':
          description: Exercise code conflict (EXERCISE_CODE_CONFLICT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/exercises/metadata:
    get:
      tags: [Admin Exercise Catalog]
      operationId: getAdminExerciseFormMetadata
      summary: Get selectable metadata for Admin Exercise create and edit forms
      description: Requires an active ADMIN role and CATALOG_MANAGE permission. Inactive equipment, tags, and movement patterns are omitted.
      responses:
        '200':
          description: Deterministically ordered form metadata; every collection is present even when empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExerciseFormMetadataResponse' }
              examples:
                populated:
                  value:
                    categories: [{ code: STRENGTH, name: Strength }]
                    muscleGroups: [{ code: CORE, name: Core, parentCode: null }]
                    equipment: [{ code: BODYWEIGHT, name: Bodyweight }]
                    tags: [{ code: COMPOUND, name: Compound }]
                    difficulties: [BEGINNER, INTERMEDIATE, ADVANCED]
                    movementPatterns: [{ code: SQUAT, name: Squat }]
                emptyCatalogs:
                  value:
                    categories: []
                    muscleGroups: []
                    equipment: []
                    tags: []
                    difficulties: [BEGINNER, INTERMEDIATE, ADVANCED]
                    movementPatterns: []
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }

  /admin/exercises/{exerciseId}:
    parameters:
      - name: exerciseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin Exercise Catalog]
      operationId: getAdminExerciseDetail
      summary: Get governed Exercise detail in any lifecycle state
      responses:
        '200':
          description: Exercise detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExerciseResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404':
          description: Exercise not found (ADMIN_EXERCISE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Admin Exercise Catalog]
      operationId: updateAdminExerciseDraft
      summary: Replace editable content of a DRAFT Exercise
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminExerciseRequest' }
      responses:
        '200':
          description: Updated Exercise draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExerciseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404':
          description: Exercise not found (ADMIN_EXERCISE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Lifecycle, version, or code conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/exercises/{exerciseId}/activate:
    post:
      tags: [Admin Exercise Catalog]
      operationId: activateAdminExercise
      summary: Activate a complete DRAFT Exercise
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExerciseVersionRequest' }
      responses:
        '200':
          description: Activated Exercise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExerciseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { description: Exercise not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Lifecycle or version conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /admin/exercises/{exerciseId}/archive:
    post:
      tags: [Admin Exercise Catalog]
      operationId: archiveAdminExercise
      summary: Archive an ACTIVE Exercise
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveExerciseRequest' }
      responses:
        '200': { description: Archived Exercise, content: { application/json: { schema: { $ref: '#/components/schemas/AdminExerciseResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { description: Exercise not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Lifecycle, canonical-target, or version conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /admin/exercises/{exerciseId}/canonical-replacement:
    put:
      tags: [Admin Exercise Catalog]
      operationId: setAdminExerciseCanonicalReplacement
      summary: Set, change, or clear an archived Exercise canonical replacement
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanonicalReplacementRequest' }
      responses:
        '200': { description: Updated canonical replacement metadata, content: { application/json: { schema: { $ref: '#/components/schemas/AdminExerciseResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { description: Source or target Exercise not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Canonical, lifecycle, or version conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /admin/exercises/{exerciseId}/canonical-replacement/preview:
    get:
      tags: [Admin Exercise Catalog]
      operationId: previewAdminExerciseCanonicalReplacement
      summary: Preview canonical replacement metadata for an archived Exercise
      description: Usage impact is explicitly unavailable until historical B04/B05 consumers are implemented; unavailable counts are null, never zero.
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Read-only canonical replacement preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalReplacementPreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { description: Source Exercise not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Source lifecycle or canonical mapping conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/registrations:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register one common User Account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and email verification required
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/email-verifications/confirmations:
    post:
      tags: [Authentication]
      operationId: confirmEmail
      summary: Confirm a registered email using a one-time token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
      responses:
        '204': { description: Email confirmed }
        '400':
          $ref: '#/components/responses/InvalidOrExpiredOneTimeToken'
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an authenticated session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountUnavailable'
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Authentication]
      operationId: logoutCurrentSession
      summary: Revoke the current refresh-token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204': { description: Session revoked or already inactive }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/token-refreshes:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new token pair
      description: >-
        The presented refresh token is invalidated when rotation succeeds.
        Reuse of a revoked/replaced token is rejected and audited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '429': { $ref: '#/components/responses/RateLimited' }

  /users/me:
    get:
      tags: [Current User]
      operationId: getCurrentUser
      summary: Get the authenticated User and activated capabilities
      responses:
        '200':
          description: Current User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Current User]
      operationId: updateCurrentUser
      summary: Update mutable account preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Updated User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /student-profiles:
    post:
      tags: [Student Profile]
      operationId: createStudentProfile
      summary: Activate the Student capability on the current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertStudentProfileRequest'
      responses:
        '201':
          description: Student Profile created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '409':
          description: >-
            Conflict — Student profile already exists (STUDENT_PROFILE_ALREADY_EXISTS)
            or Student capability has been revoked (STUDENT_CAPABILITY_REVOKED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student-profiles/me:
    get:
      tags: [Student Profile]
      operationId: getMyStudentProfile
      summary: Get the current User's Student Profile
      responses:
        '200':
          description: Student Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Student capability is not active (STUDENT_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
    patch:
      tags: [Student Profile]
      operationId: updateMyStudentProfile
      summary: Update the current User's Student Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertStudentProfileRequest'
      responses:
        '200':
          description: Updated Student Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Student capability is not active (STUDENT_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }

  /trainer-profiles:
    post:
      tags: [Trainer Profile]
      operationId: createTrainerProfile
      summary: Create a Trainer Profile without granting coaching authority
      description: >-
        Coaching authority remains unavailable until verification, activity,
        and applicable policy conditions are all satisfied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainerProfileRequest'
      responses:
        '201':
          description: Trainer Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '409':
          description: >-
            Conflict — Trainer Profile already exists (TRAINER_PROFILE_ALREADY_EXISTS),
            public slug is already in use (TRAINER_SLUG_ALREADY_EXISTS),
            or Trainer capability has been revoked (TRAINER_CAPABILITY_REVOKED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trainer-profiles/me:
    get:
      tags: [Trainer Profile]
      operationId: getMyTrainerProfile
      summary: Get the current User's Trainer Profile and eligibility state
      responses:
        '200':
          description: Trainer Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerProfileResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
    patch:
      tags: [Trainer Profile]
      operationId: updateMyTrainerProfile
      summary: Update mutable Trainer Profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainerProfileRequest'
      responses:
        '200':
          description: Updated Trainer Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '409':
          description: Conflict — Public slug is already in use by another trainer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trainer-applications:
    post:
      tags: [Trainer Application]
      operationId: submitTrainerApplication
      summary: Submit the current Trainer Profile for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTrainerApplicationRequest'
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden - Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: A Trainer Profile must exist first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: An active application already exists or the transition is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trainer-applications/me/current:
    get:
      tags: [Trainer Application]
      operationId: getMyCurrentTrainerApplication
      summary: Get the current Trainer Application
      responses:
        '200':
          description: Current application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerApplicationResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden - Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No Trainer Application exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/trainer-applications:
    get:
      tags: [Admin Trainer Verification]
      operationId: getAdminTrainerApplications
      summary: List trainer verification applications for administrative review
      description: >-
        Lists applications filtered by status (defaults to PENDING queue) with
        deterministic sorting (submitted_at ASC, id ASC) and pagination.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TrainerVerificationStatus'
          description: Filter applications by verification status. Defaults to PENDING if omitted.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based page index.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (maximum 100).
      responses:
        '200':
          description: Page of trainer applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrainerApplicationPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or User lacks active ADMIN role (ACCESS_DENIED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/trainer-applications/{applicationId}:
    get:
      tags: [Admin Trainer Verification]
      operationId: getAdminTrainerApplicationDetail
      summary: Get detailed trainer application view including confidential review notes
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the trainer application.
      responses:
        '200':
          description: Detailed trainer application view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrainerApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or User lacks active ADMIN role (ACCESS_DENIED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Application not found (TRAINER_APPLICATION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/trainer-applications/{applicationId}/decisions:
    post:
      tags: [Admin Trainer Verification]
      operationId: decideTrainerApplication
      summary: Approve or reject a pending trainer application
      description: >-
        Transitions a PENDING application to VERIFIED or REJECTED. Updates trainer
        profile verification status and timestamps, appends status history, and
        records an audit entry.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the trainer application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideTrainerApplicationRequest'
      responses:
        '200':
          description: Application decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrainerApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or User lacks active ADMIN role (ACCESS_DENIED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Application not found (TRAINER_APPLICATION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: >-
            Conflict — Application is not in PENDING state, has already been decided
            (TRAINER_APPLICATION_ALREADY_DECIDED), or trainer profile is not in PENDING state (INVALID_LIFECYCLE_TRANSITION).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goals:
    get:
      tags: [Fitness Goal]
      operationId: getStudentFitnessGoals
      summary: List fitness goals for the authenticated student
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GoalLifecycleStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of fitness goals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
    post:
      tags: [Fitness Goal]
      operationId: createFitnessGoal
      summary: Create a student fitness goal
      description: >-
        Creates a new Student-owned Fitness Goal with version, objectives, and targets.
        Can be initialized in DRAFT or ACTIVE state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFitnessGoalRequest'
      responses:
        '201':
          description: Fitness goal created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '409':
          $ref: '#/components/responses/ActiveFitnessGoalAlreadyExists'

  /fitness-goals/me/current:
    get:
      tags: [Fitness Goal]
      operationId: getCurrentFitnessGoal
      summary: Get current active or manageable fitness goal for the authenticated student
      parameters:
        - name: includePaused
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, returns the active goal if present, or the most recent paused goal if no active goal exists.
      responses:
        '200':
          description: Current active or paused fitness goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }

  /fitness-goals/{goalId}:
    get:
      tags: [Fitness Goal]
      operationId: getFitnessGoalDetail
