        Explicit zero is a known value, not missing data.
      required: [name, servingLabel, commandKey]
      properties:
        name: { type: string, minLength: 1 }
        servingLabel: { type: string, minLength: 1 }
        energyKcal: { type: [number, 'null'], minimum: 0 }
        proteinG: { type: [number, 'null'], minimum: 0 }
        carbohydrateG: { type: [number, 'null'], minimum: 0 }
        fatG: { type: [number, 'null'], minimum: 0 }
        expectedVersion: { type: [integer, 'null'], format: int64, minimum: 0 }
        commandKey: { type: string, minLength: 1, maxLength: 120 }
