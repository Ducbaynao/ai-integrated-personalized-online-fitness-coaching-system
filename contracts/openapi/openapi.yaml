      responses:
        '200': { description: Aborted execution detail, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutExecutionDetail' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutExecutionForbidden' }
        '404': { $ref: '#/components/responses/WorkoutExecutionConcealed' }
        '409': { $ref: '#/components/responses/WorkoutExecutionConflict' }

  /ai/knowledge/query:
    post:
      tags: [AI General Knowledge (F01)]
      operationId: queryGeneralFitnessKnowledge
      summary: Ask general fitness and exercise technique questions with citations (F01)
      description: >-
        [PHASE 2 - CONTRACT ONLY / NOT YET IMPLEMENTED]
        Phase 2 F01 executable contract baseline (P2-M0/P2-M2 preparation). Endpoint implementation pending P2-M2; currently contract-only.
        Actor (Student or Trainer) submits a general fitness question. Spring Boot enforces authentication
        and actor capability, builds the authorized minimal context, queries the internal AI Assistance service,
        validates the output against schema and Active knowledge boundaries, audits the AI Run, and returns
        an immutable INFORMATION projection with structured citations.
        Does not accept personal coaching context in first iteration. Does not create recommendations or plan mutations.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/F01KnowledgeQueryRequest' }
      responses:
        '200':
          description: Completed query (INFORMATION, INSUFFICIENT_DATA or policy BLOCKED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/F01KnowledgeQueryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AIForbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '404':
          description: Exercise catalog reference is unavailable or not ACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Internal processing failure; sanitized FAILED AI Run projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/F01KnowledgeQueryResponse' }
        '502':
          description: Provider or output validation failure; no generated answer is exposed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/F01KnowledgeQueryResponse' }
        '504':
          description: Provider timeout; sanitized FAILED AI Run projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/F01KnowledgeQueryResponse' }

  /admin/content/knowledge/import:
    post:
      tags: [Admin Content Knowledge]
      operationId: importKnowledgeCorpusBundle
      summary: Import a bundle of normalized knowledge documents and versions
      description: >-
        Requires platform ADMIN role and explicit KNOWLEDGE_IMPORT permission (e.g. via CONTENT_ADMIN assignment).
        Base ADMIN role does not grant Content permissions by default. Ingests normalized corpus items as DRAFT versions,
        verifies SHA-256 content hashes, enforces idempotency, links review evidence, and records immutable audit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCorpusBundleRequest' }
      responses:
        '200':
          description: Import completed successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportCorpusResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Conflict due to checksum mismatch for existing version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/content/knowledge/versions/{versionId}/review:
    post:
      tags: [Admin Content Knowledge]
      operationId: reviewKnowledgeVersion
      summary: Record specialist/expert review for a draft knowledge version
      description: >-
        Requires platform ADMIN role and explicit KNOWLEDGE_REVIEW permission (e.g. via CONTENT_ADMIN assignment).
        Base ADMIN role does not grant Content permissions by default. Records an approved, changes-requested,
        or rejected review event for a DRAFT version.
      security:
        - bearerAuth: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewKnowledgeVersionRequest' }
      responses:
        '200':
          description: Review recorded successfully
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Knowledge version not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Version is not in DRAFT status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/content/knowledge/versions/{versionId}/publish:
    post:
      tags: [Admin Content Knowledge]
      operationId: publishKnowledgeVersion
      summary: Publish an approved knowledge version to ACTIVE status
      description: >-
        Requires platform ADMIN role and explicit KNOWLEDGE_PUBLISH permission (e.g. via CONTENT_ADMIN assignment).
        Base ADMIN role does not grant Content permissions by default. Enforces publish guardrails:
        rejects if HELD_AS_DRAFT, requires an APPROVED review. Transitions status to ACTIVE
        and triggers decoupled AI indexing eligibility notification.
      security:
        - bearerAuth: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Version published successfully to ACTIVE
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Knowledge version not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Publish guardrail failed (held as draft, missing approval, or already published)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/content/knowledge/versions/{versionId}/archive:
    post:
      tags: [Admin Content Knowledge]
      operationId: archiveKnowledgeVersion
      summary: Archive an ACTIVE knowledge version
      description: >-
        Requires platform ADMIN role and explicit KNOWLEDGE_ARCHIVE permission (e.g. via CONTENT_ADMIN assignment).
        Base ADMIN role does not grant Content permissions by default. Transitions status from ACTIVE to ARCHIVED,
        preserving immutable version history and lineage.
      security:
        - bearerAuth: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveKnowledgeVersionRequest' }
      responses:
        '200':
          description: Version archived successfully
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Knowledge version not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Version is not ACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/content/knowledge/documents:
    get:
