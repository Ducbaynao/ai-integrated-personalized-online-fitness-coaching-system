        - { $ref: '#/components/parameters/WorkoutExecutionPage' }
        - { $ref: '#/components/parameters/WorkoutExecutionSize' }
      responses:
        '200': { description: Performed-start descending page with execution-ID tie-break, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutExecutionPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /workout-executions/{executionId}:
