openapi: 3.1.0
info:
  title: AI Integrated Personalized Online Fitness Coaching System API
  version: 0.1.0
  description: >-
    Executable REST contract for implemented platform capabilities. Spring Boot
    is the business authority. Creating a Trainer Profile or submitting a Trainer
    Application does not grant coaching authority.
  license:
    name: License decision pending
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Authentication
    description: Account registration, verification, authentication, session refresh, and logout operations.
  - name: Current User
    description: Profile query, settings management, and account details for the authenticated user.
  - name: Student Profile
    description: Student capability activation and profile management on the common account.
  - name: Trainer Profile
    description: Trainer capability activation and profile management on the common account.
  - name: Trainer Application
    description: Submission and status tracking for trainer verification applications.
  - name: Admin Trainer Verification
    description: Verification review, approval, and rejection of trainer applications by platform administrators.
  - name: Fitness Goal
    description: Student-owned fitness goal management, versioning, objectives, and measurable targets.
  - name: Coaching Lifecycle
    description: Student-Trainer relationship and minimal effective-period lifecycle.
  - name: Coaching Data Sharing
    description: Student-owned scoped sharing decisions and immutable decision history.
  - name: Exercise Catalog
    description: Authenticated Student and Trainer read access to the active Exercise catalog.
  - name: Admin Exercise Catalog
    description: Permission-protected Exercise draft, lifecycle, and canonical replacement management.
  - name: Workout Plan
    description: Actor-scoped Workout Plan authoring, lifecycle, immutable versions, and occurrence adjustments.
  - name: Workout Schedule
    description: Student-confirmed Planned Workout batches, Trainer proposals, and authority-scoped occurrence calendars.
  - name: Workout Execution
    description: Student-owned workout execution, actual set logging, terminal outcomes, and authority-scoped history.
  - name: Basic Nutrition
    description: Student-owned user-reported food and day logging; no strategic target or AI estimation authority.
  - name: Nutrition Strategy
    description: Student-confirmed Nutrition Goal, effective target versions, Trainer proposals and frozen daily targets.
  - name: Nutrition Catalog
    description: Admin-curated USDA Foundation subset, separate from Student USER_REPORTED private foods.
  - name: Chat
    description: Period-scoped Student–Trainer text messaging with durable REST history.
  - name: In-App Notification
    description: Generic, privacy-safe message notifications for currently authorized recipients.
  - name: Attention and Review
    description: Deterministic M7 signals and Student-confirmed, period-scoped coaching review tasks.
  - name: AI General Knowledge (F01)
    description: >-
      [PHASE 2 - CONTRACT ONLY / NOT YET IMPLEMENTED]
      General fitness and exercise science knowledge inquiry grounded in governed ACTIVE knowledge sources (ISSN, WHO, NIDDK, NIH ODS).
      Spring Boot validates actor capability, builds minimal authorized context, and orchestrates AI pipeline.
      Returns resultType: INFORMATION with citations; no recommendation lifecycle or apply actions.

paths:
  /review-timezone/me:
    get:
      tags: [Attention and Review]
      operationId: getMyConfirmedReviewTimezone
      description: 204 means the Student has not explicitly confirmed a review timezone; the users.timezone default is not confirmation.
      responses:
        '200': { description: Student confirmation, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewTimezoneConfirmation' } } } }
        '204': { description: Not yet explicitly confirmed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
    put:
      tags: [Attention and Review]
      operationId: confirmMyReviewTimezone
      description: Student explicitly confirms an IANA zone. Existing tasks retain their stored zone/date; future tasks use the latest confirmation. Same actor/key/payload replays a stable response.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewTimezoneRequest' } } } }
      responses:
        '200': { description: Confirmed zone, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewTimezoneConfirmation' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
        '409': { $ref: '#/components/responses/AttentionConflict' }
  /review-tasks/me:
    get:
      tags: [Attention and Review]
      operationId: listMyReviewTasks
      description: Student reads their own tasks across periods. GET never acknowledges a review.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: cycleStartDate DESC then id DESC, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewTaskPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
  /students/{studentId}/review-tasks:
    get:
      tags: [Attention and Review]
      operationId: listCurrentTrainerReviewTasks
      description: Current active human-period Trainer only; previous periods are concealed even on reassignment.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Current-period tasks only, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewTaskPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
  /review-tasks/{id}:
    get:
      tags: [Attention and Review]
      operationId: getReviewTask
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Authorized task, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewTask' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
  /review-tasks/{id}/complete:
    post:
      tags: [Attention and Review]
      operationId: completeReviewTask
      description: Current-period Trainer only; summary/evidence/unknowns are factual. No Goal, Plan or Nutrition mutation. Optimistic version and actor-scoped command key are rechecked after authority.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteReviewRequest' } } } }
      responses:
        '200': { description: Completed review, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewTask' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
        '409': { $ref: '#/components/responses/AttentionConflict' }
  /review-tasks/{id}/acknowledge:
    post:
      tags: [Attention and Review]
      operationId: acknowledgeViewedReview
      description: Student-only explicit viewed acknowledgement; completion never depends on this command.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttentionVersionedCommand' } } } }
      responses:
        '200': { description: Acknowledged review, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewTask' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
        '409': { $ref: '#/components/responses/AttentionConflict' }
  /attention-signals/me:
    get:
      tags: [Attention and Review]
      operationId: listMyAttentionSignals
      description: Student reads own rule signals, including historical periods; no AI recommendation is represented as a rule signal.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: createdAt DESC then id DESC, content: { application/json: { schema: { $ref: '#/components/schemas/AttentionSignalPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
  /students/{studentId}/attention-signals:
    get:
      tags: [Attention and Review]
      operationId: listCurrentTrainerAttentionSignals
      description: Current ACTIVE HUMAN_COACH period only. MISSED_PLANNED_V1 additionally requires WORKOUT_HISTORY VIEW. Unauthorized rows cannot affect pagination or count.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Authorized page, content: { application/json: { schema: { $ref: '#/components/schemas/AttentionSignalPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
  /attention-signals/{id}:
    get:
      tags: [Attention and Review]
      operationId: getAttentionSignal
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Authorized signal, content: { application/json: { schema: { $ref: '#/components/schemas/AttentionSignal' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
  /attention-signals/{id}/history:
    get:
      tags: [Attention and Review]
      operationId: getAttentionSignalHistory
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Append-only transitions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttentionSignalEvent' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
  /attention-signals/{id}/actions:
    post:
      tags: [Attention and Review]
      operationId: actOnAttentionSignal
      description: Current authorized Trainer only; ACK/RESOLVE/DISMISS. RESOLVE and DISMISS need reason. Authority rechecked before replay.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttentionSignalActionRequest' } } } }
      responses:
        '200': { description: Changed signal, content: { application/json: { schema: { $ref: '#/components/schemas/AttentionSignal' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AttentionConcealed' }
        '409': { $ref: '#/components/responses/AttentionConflict' }
  /chat/conversations:
    get:
      tags: [Chat]
      operationId: listChatConversations
      summary: List only conversations currently readable by the actor
      description: Student retains their own old-period history; Trainer sees only the current effective period. No unauthorized count is returned.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Stable updatedAt DESC, conversationId DESC page
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatConversationPage' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /chat/conversations/{id}:
    get:
      tags: [Chat]
      operationId: getChatConversation
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Currently authorized conversation
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatConversation' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ChatConcealed' }
  /chat/conversations/{id}/messages:
    get:
      tags: [Chat]
      operationId: listChatMessages
      description: GET never marks messages READ. Reconnect always refetches this authoritative history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
      responses:
        '200':
          description: Stable sentAt DESC, messageId DESC page
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessagePage' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ChatConcealed' }
  /chat/students/{studentId}/messages:
    post:
      tags: [Chat]
      operationId: sendChatText
      description: >-
        Student or current Trainer sends text into the current ACTIVE human Coaching Period.
        The first send creates the period conversation. An actor-scoped commandKey with the same
        payload replays without a second message/notification; changed payload returns 409.
        Authority is rechecked before replay. Message and generic IN_APP notification commit atomically.
      parameters: [{ name: studentId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChatSendRequest' } } }
      responses:
        '201':
          description: Committed SENT message; exact replay returns the same identity
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessage' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ChatConcealed' }
        '409': { $ref: '#/components/responses/ChatConflict' }
  /chat/messages/{messageId}/receipts:
    post:
      tags: [Chat]
      operationId: acknowledgeChatMessage
      description: Recipient-only DELIVERED or READ acknowledgment, monotonic and idempotent per user. READ also sets deliveredAt.
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChatReceiptRequest' } } }
      responses:
        '200':
          description: Current message and recipient receipt state
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessage' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ChatConcealed' }
  /chat/updates:
    get:
      tags: [Chat]
      operationId: connectChatUpdates
      summary: Authenticated WebSocket upgrade for post-commit invalidation only
      description: >-
        Bearer Authorization header is required. Client sends SUBSCRIBE with conversationId
        or SUBSCRIBE_INBOX for authorized first-message/inbox invalidation;
        server rechecks authority and sends only CHAT_UPDATED with conversationId after commit.
        No message body or notification content is sent. On reconnect, fetch REST history.
      responses:
        '101': { description: WebSocket upgrade }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /notifications/me:
    get:
      tags: [In-App Notification]
      operationId: listMyInAppNotifications
      description: >-
        Mixed Chat and implemented Appointment lifecycle facts. Source-object authority is
        checked before pagination and again on read/deep link; former Trainers cannot infer
        old-period notifications. Other proposal/coaching-request producers remain deferred
        until their source-specific authority hooks are executable.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Stable createdAt DESC, notificationId DESC page
          content: { application/json: { schema: { $ref: '#/components/schemas/InAppNotificationPage' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /notifications/me/{id}/read:
    post:
      tags: [In-App Notification]
      operationId: markInAppNotificationRead
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Idempotently marked read without marking the related message READ
          content: { application/json: { schema: { $ref: '#/components/schemas/InAppNotification' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ChatConcealed' }
  /nutrition/catalog/foods:
    get:
      tags: [Nutrition Catalog]
      operationId: listPublishedNutritionCatalogFoods
      summary: Read the small published USDA Foundation subset; no private foods are included
      responses:
        '200': { description: Published foods, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NutritionCatalogFood' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /nutrition/catalog/foods/{foodId}:
    get:
      tags: [Nutrition Catalog]
      operationId: getPublishedNutritionCatalogFood
      parameters: [{ name: foodId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Current published revision and approved portion evidence, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionCatalogFood' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NutritionConcealed' }
  /admin/nutrition/catalog/foods:
    get:
      tags: [Nutrition Catalog]
      operationId: listAdminNutritionCatalogFoods
      summary: Active ADMIN with CATALOG_MANAGE reads drafts, published and retired foods
      responses:
        '200': { description: Admin catalog, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NutritionCatalogFood' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NutritionForbidden' }
    post:
      tags: [Nutrition Catalog]
      operationId: createAdminNutritionCatalogDraft
      summary: Admin selects one pinned USDA Foundation source record into a draft
      description: Source values are reviewed Admin input from the pinned release; no live USDA call or USER_REPORTED promotion.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionCatalogDraftRequest' } } } }
      responses:
        '201': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionCatalogFood' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NutritionForbidden' }
        '409': { $ref: '#/components/responses/NutritionConflict' }
  /admin/nutrition/catalog/foods/{foodId}/revisions:
    post:
      tags: [Nutrition Catalog]
      operationId: reviseAdminNutritionCatalogFood
      summary: Admin creates a new immutable revision; existing logs retain their pinned revision and nutrient facts
      parameters: [{ name: foodId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionCatalogRevisionRequest' } } } }
      responses:
        '200': { description: Updated aggregate, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionCatalogFood' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NutritionForbidden' }
        '404': { $ref: '#/components/responses/NutritionConcealed' }
        '409': { $ref: '#/components/responses/NutritionConflict' }
  /admin/nutrition/catalog/foods/{foodId}/transitions:
    post:
      tags: [Nutrition Catalog]
      operationId: transitionAdminNutritionCatalogFood
      summary: Admin publishes a draft or retires a published food, with reason and audit
      parameters: [{ name: foodId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionCatalogTransitionRequest' } } } }
      responses:
        '200': { description: Updated aggregate, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionCatalogFood' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NutritionForbidden' }
        '404': { $ref: '#/components/responses/NutritionConcealed' }
        '409': { $ref: '#/components/responses/NutritionConflict' }
  /nutrition/days/{day}/catalog-items:
    post:
      tags: [Basic Nutrition]
      operationId: logPublishedNutritionCatalogItem
      summary: Student confirms one catalog item with explicit approved quantity evidence
      description: >-
        GRAM uses the per-100g source basis. SERVING needs approved gramsPerServing;
        MILLILITRE needs separately evidenced gramsPerMl. No intermediate rounding or
        silent conversion. A revision change or absent factor conflicts; meal nutrient
        snapshots remain unchanged by later catalog revisions.
      parameters: [{ name: day, in: path, required: true, schema: { type: string, format: date } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionCatalogItemRequest' } } } }
      responses:
        '201': { description: Day with real persisted item and actual nutrient facts, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionDay' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NutritionForbidden' }
        '404': { $ref: '#/components/responses/NutritionConcealed' }
        '409': { $ref: '#/components/responses/NutritionConflict' }
  /nutrition/strategy/goal-types:
    get:
      tags: [Nutrition Strategy]
      operationId: listNutritionGoalTypes
      summary: Read active Goal types from the existing catalog
      responses:
        '200':
          description: Catalog entries; an empty catalog does not authorize Mobile to invent types
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NutritionGoalType' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /nutrition/strategy/target-nutrients:
    get:
      tags: [Nutrition Strategy]
      operationId: listNutritionTargetNutrients
      summary: Read nutrient identities and their default dimension-correct unit presentation
      description: Unit identities are catalog data, not client constants; the server validates any submitted unit dimension.
      responses:
        '200':
          description: Available nutrient and default unit references
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NutritionTargetNutrient' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /nutrition/strategy/me:
    get:
      tags: [Nutrition Strategy]
      operationId: getMyNutritionStrategy
      summary: Read Student-owned current Goal, versions and proposals without changing targets
      responses:
        '200': { description: Strategy state, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionStrategyState' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NutritionForbidden' }
  /nutrition/strategy/goals:
    post:
      tags: [Nutrition Strategy]
      operationId: confirmStudentNutritionStrategyChange
      summary: Student confirms NEW_GOAL or CHANGE_TARGET and publishes an immutable target version
      description: >-
        Uses actor-scoped commandKey and expectedGoalVersion/baseVersionId for changes. Same key/body replays
        one effect; a changed body conflicts. A new Goal conflicts while another ACTIVE Goal exists.
        First version may start today only if that day has no frozen target; later versions start tomorrow or later.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionStrategyChangeRequest' } } } }
      responses:
        '200': { description: Published Goal and version, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionStrategyGoal' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NutritionForbidden' }
        '404': { $ref: '#/components/responses/NutritionConcealed' }
