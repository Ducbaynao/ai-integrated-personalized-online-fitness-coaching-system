openapi: 3.1.0
info:
  title: AI Integrated Personalized Online Fitness Coaching System API
  version: 0.1.0
  description: >-
    Executable REST contract for Phase 1 Milestone 1 Identity and Common
    Account. Spring Boot is the business authority. Creating a Trainer Profile
    or submitting a Trainer Application does not grant coaching authority.
  license:
    name: License decision pending
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Authentication
    description: Account registration, verification, authentication, session refresh, and logout operations.
  - name: Current User
    description: Profile query, settings management, and account details for the authenticated user.
  - name: Student Profile
    description: Student capability activation and profile management on the common account.
  - name: Trainer Profile
    description: Trainer capability activation and profile management on the common account.
  - name: Trainer Application
    description: Submission and status tracking for trainer verification applications.
  - name: Admin Trainer Verification
    description: Verification review, approval, and rejection of trainer applications by platform administrators.
  - name: Fitness Goal
    description: Student-owned fitness goal management, versioning, objectives, and measurable targets.

paths:
  /auth/registrations:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register one common User Account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and email verification required
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/email-verifications/confirmations:
    post:
      tags: [Authentication]
      operationId: confirmEmail
      summary: Confirm a registered email using a one-time token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
      responses:
        '204': { description: Email confirmed }
        '400':
          $ref: '#/components/responses/InvalidOrExpiredOneTimeToken'
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an authenticated session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountUnavailable'
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Authentication]
      operationId: logoutCurrentSession
      summary: Revoke the current refresh-token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204': { description: Session revoked or already inactive }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/token-refreshes:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new token pair
      description: >-
        The presented refresh token is invalidated when rotation succeeds.
        Reuse of a revoked/replaced token is rejected and audited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '429': { $ref: '#/components/responses/RateLimited' }

  /users/me:
    get:
      tags: [Current User]
      operationId: getCurrentUser
      summary: Get the authenticated User and activated capabilities
      responses:
        '200':
          description: Current User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Current User]
      operationId: updateCurrentUser
      summary: Update mutable account preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Updated User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /student-profiles:
    post:
      tags: [Student Profile]
      operationId: createStudentProfile
      summary: Activate the Student capability on the current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertStudentProfileRequest'
      responses:
        '201':
          description: Student Profile created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '409':
          description: >-
            Conflict — Student profile already exists (STUDENT_PROFILE_ALREADY_EXISTS)
            or Student capability has been revoked (STUDENT_CAPABILITY_REVOKED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student-profiles/me:
    get:
      tags: [Student Profile]
      operationId: getMyStudentProfile
      summary: Get the current User's Student Profile
      responses:
        '200':
          description: Student Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Student capability is not active (STUDENT_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
    patch:
      tags: [Student Profile]
      operationId: updateMyStudentProfile
      summary: Update the current User's Student Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertStudentProfileRequest'
      responses:
        '200':
          description: Updated Student Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Student capability is not active (STUDENT_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }

  /trainer-profiles:
    post:
      tags: [Trainer Profile]
      operationId: createTrainerProfile
      summary: Create a Trainer Profile without granting coaching authority
      description: >-
        Coaching authority remains unavailable until verification, activity,
        and applicable policy conditions are all satisfied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainerProfileRequest'
      responses:
        '201':
          description: Trainer Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '409':
          description: >-
            Conflict — Trainer Profile already exists (TRAINER_PROFILE_ALREADY_EXISTS),
            public slug is already in use (TRAINER_SLUG_ALREADY_EXISTS),
            or Trainer capability has been revoked (TRAINER_CAPABILITY_REVOKED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trainer-profiles/me:
    get:
      tags: [Trainer Profile]
      operationId: getMyTrainerProfile
      summary: Get the current User's Trainer Profile and eligibility state
      responses:
        '200':
          description: Trainer Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerProfileResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
    patch:
      tags: [Trainer Profile]
      operationId: updateMyTrainerProfile
      summary: Update mutable Trainer Profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainerProfileRequest'
      responses:
        '200':
          description: Updated Trainer Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '409':
          description: Conflict — Public slug is already in use by another trainer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trainer-applications:
    post:
      tags: [Trainer Application]
      operationId: submitTrainerApplication
      summary: Submit the current Trainer Profile for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTrainerApplicationRequest'
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden - Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: A Trainer Profile must exist first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: An active application already exists or the transition is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trainer-applications/me/current:
    get:
      tags: [Trainer Application]
      operationId: getMyCurrentTrainerApplication
      summary: Get the current Trainer Application
      responses:
        '200':
          description: Current application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerApplicationResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden - Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or Trainer capability is not active (TRAINER_CAPABILITY_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No Trainer Application exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/trainer-applications:
    get:
      tags: [Admin Trainer Verification]
      operationId: getAdminTrainerApplications
      summary: List trainer verification applications for administrative review
      description: >-
        Lists applications filtered by status (defaults to PENDING queue) with
        deterministic sorting (submitted_at ASC, id ASC) and pagination.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TrainerVerificationStatus'
          description: Filter applications by verification status. Defaults to PENDING if omitted.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based page index.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (maximum 100).
      responses:
        '200':
          description: Page of trainer applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrainerApplicationPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or User lacks active ADMIN role (ACCESS_DENIED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/trainer-applications/{applicationId}:
    get:
      tags: [Admin Trainer Verification]
      operationId: getAdminTrainerApplicationDetail
      summary: Get detailed trainer application view including confidential review notes
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the trainer application.
      responses:
        '200':
          description: Detailed trainer application view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrainerApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or User lacks active ADMIN role (ACCESS_DENIED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Application not found (TRAINER_APPLICATION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/trainer-applications/{applicationId}/decisions:
    post:
      tags: [Admin Trainer Verification]
      operationId: decideTrainerApplication
      summary: Approve or reject a pending trainer application
      description: >-
        Transitions a PENDING application to VERIFIED or REJECTED. Updates trainer
        profile verification status and timestamps, appends status history, and
        records an audit entry.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the trainer application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideTrainerApplicationRequest'
      responses:
        '200':
          description: Application decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrainerApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden — Account state does not permit the requested operation (ACCOUNT_UNAVAILABLE)
            or User lacks active ADMIN role (ACCESS_DENIED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Application not found (TRAINER_APPLICATION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: >-
            Conflict — Application is not in PENDING state, has already been decided
            (TRAINER_APPLICATION_ALREADY_DECIDED), or trainer profile is not in PENDING state (INVALID_LIFECYCLE_TRANSITION).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goals:
    post:
      tags: [Fitness Goal]
      operationId: createFitnessGoal
      summary: Create a student fitness goal
      description: >-
        Creates a new Student-owned Fitness Goal with version, objectives, and targets.
        Can be initialized in DRAFT or ACTIVE state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFitnessGoalRequest'
      responses:
        '201':
          description: Fitness goal created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '409':
          $ref: '#/components/responses/ActiveFitnessGoalAlreadyExists'

  /fitness-goals/me/current:
    get:
      tags: [Fitness Goal]
      operationId: getCurrentFitnessGoal
      summary: Get current active fitness goal for the authenticated student
      responses:
        '200':
          description: Current active fitness goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }

  /fitness-goals/{goalId}:
    get:
      tags: [Fitness Goal]
      operationId: getFitnessGoalDetail
      summary: Get fitness goal details by ID
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fitness goal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }

  /fitness-goals/{goalId}/activate:
    post:
      tags: [Fitness Goal]
      operationId: activateFitnessGoal
      summary: Activate a draft fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateFitnessGoalRequest'
      responses:
        '200':
          description: Fitness goal activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /fitness-goals/{goalId}/pause:
    post:
      tags: [Fitness Goal]
      operationId: pauseFitnessGoal
      summary: Pause an active fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseFitnessGoalRequest'
      responses:
        '200':
          description: Fitness goal paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Only owning student may pause personal fitness goal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Fitness goal or student profile not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflict - Goal is not in ACTIVE status or concurrent modification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goals/{goalId}/resume:
    post:
      tags: [Fitness Goal]
      operationId: resumeFitnessGoal
      summary: Resume a paused fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeFitnessGoalRequest'
      responses:
        '200':
          description: Fitness goal resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Only owning student may resume personal fitness goal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Fitness goal or student profile not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflict - Goal is not in PAUSED status, active goal already exists, or concurrent modification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goals/{goalId}/versions:
    get:
      tags: [Fitness Goal]
      operationId: getGoalVersions
      summary: List version history for a fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated goal versions ordered newest to oldest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalVersionPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
    post:
      tags: [Fitness Goal]
      operationId: createGoalVersion
      summary: Create a new same-journey version for an active fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalVersionRequest'
      responses:
        '201':
          description: Goal version created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalVersionResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
        '409':
          description: >-
            Conflict - Goal version conflict or concurrent modification (GOAL_VERSION_CONFLICT),
            new goal journey required (NEW_GOAL_JOURNEY_REQUIRED),
            no changes detected (GOAL_VERSION_NO_CHANGES),
            or invalid lifecycle transition (INVALID_LIFECYCLE_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fitness-goals/{goalId}/versions/{versionId}:
    get:
      tags: [Fitness Goal]
      operationId: getGoalVersionDetail
      summary: Get details of a specific fitness goal version
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Goal version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalVersionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/GoalVersionNotFound' }

  /fitness-goals/{goalId}/transitions:
    get:
      tags: [Fitness Goal]
      operationId: getGoalTransitions
      summary: List transition history for a fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of goal transitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalTransitionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
    post:
      tags: [Fitness Goal]
      operationId: createGoalTransition
      summary: Transition an active fitness goal to a new journey
      description: >-
        Transitions an active fitness goal to REPLACED and creates a new goal starting at Version 1
        with a different PRIMARY goal type, preserving all history.
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalTransitionRequest'
      responses:
        '201':
          description: Goal transition created and new goal activated
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalTransitionResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
        '409':
          description: >-
            Conflict - Same goal journey not permitted (SAME_GOAL_JOURNEY_NOT_PERMITTED),
            goal transition conflict (GOAL_TRANSITION_CONFLICT),
            or invalid lifecycle transition (INVALID_LIFECYCLE_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fitness-goals/{goalId}/transitions/{transitionId}:
    get:
      tags: [Fitness Goal]
      operationId: getGoalTransitionDetail
      summary: Get details of a specific goal transition
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: transitionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Goal transition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalTransitionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Goal transition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fitness-goals/{goalId}/proposals:
    post:
      tags: [Fitness Goal Proposal]
      operationId: createGoalProposal
      summary: Create a goal proposal for an active student fitness goal
      description: >-
        Allows an authorized, eligible Trainer with an active coaching relationship,
        active human coaching period, and active data-sharing permission to propose
        modifications to an active fitness goal.
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalProposalRequest'
      responses:
        '201':
          description: Goal proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden - Trainer is not eligible, coaching relationship is required,
            or data sharing permission is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
        '409':
          description: Conflict - Fitness goal is not in ACTIVE status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goal-proposals/me:
    get:
      tags: [Fitness Goal Proposal]
      operationId: getMyGoalProposals
      summary: List fitness goal proposals for the authenticated student
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProposalStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of goal proposals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }

  /fitness-goal-proposals/{proposalId}:
    get:
      tags: [Fitness Goal Proposal]
      operationId: getGoalProposalDetail
      summary: Get goal proposal detail with current-versus-proposed comparison data
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Goal proposal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Requester is not the proposal student or creator trainer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Goal proposal not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goal-proposals/{proposalId}/decisions:
    post:
      tags: [Fitness Goal Proposal]
      operationId: decideGoalProposal
      summary: Accept or reject a fitness goal proposal
      description: >-
        Allows the owning student to ACCEPT or REJECT a pending goal proposal.
        ACCEPT atomically creates a new same-journey fitness goal version (if primary goal type matches)
        or transitions the previous goal to REPLACED and creates a new goal starting at Version 1 (if primary goal type changes).
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideGoalProposalRequest'
      responses:
        '200':
          description: Goal proposal decided successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '400':
          description: Bad Request - Invalid decision format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Only owning student may decide personal goal proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Goal proposal not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: >-
            Conflict - Goal proposal already decided (GOAL_PROPOSAL_ALREADY_DECIDED),
            expired (GOAL_PROPOSAL_EXPIRED), base goal version is stale (STALE_GOAL_PROPOSAL),
            proposed primary goal type differs from base journey (NEW_GOAL_JOURNEY_REQUIRED),
            or proposed version contains no changes (GOAL_VERSION_NO_CHANGES).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCredentials:
      description: Email or password is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AccountUnavailable:
      description: Account state does not permit the requested operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidRefreshToken:
      description: Refresh token is invalid, expired, revoked, or reused
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidOrExpiredOneTimeToken:
      description: One-time token is invalid, expired, or already consumed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    EmailAlreadyRegistered:
      description: Email already belongs to an account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ProfileNotFound:
      description: Requested capability profile does not exist for this User
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ActiveFitnessGoalAlreadyExists:
      description: An active fitness goal already exists for this student (ACTIVE_FITNESS_GOAL_ALREADY_EXISTS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    FitnessGoalNotFound:
      description: Fitness goal not found (FITNESS_GOAL_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GoalVersionNotFound:
      description: Goal version not found (GOAL_VERSION_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GoalVersionConflict:
      description: Goal version conflict or concurrent modification (GOAL_VERSION_CONFLICT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        preferredLocale:
          type: string
          default: vi-VN
          maxLength: 16
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh
          maxLength: 64

    RegistrationResponse:
      type: object
      required: [user, verificationRequired]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        verificationRequired: { type: boolean, const: true }

    ConfirmEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 512
          writeOnly: true

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        deviceName: { type: string, maxLength: 200 }

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 2048, writeOnly: true }
        deviceName: { type: string, maxLength: 200 }

    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 2048, writeOnly: true }

    TokenPairResponse:
      type: object
      required: [tokenType, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, user]
      properties:
        tokenType: { type: string, const: Bearer }
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/CurrentUserResponse' }

    UserSummary:
      type: object
      required: [id, email, displayName, status, preferredLocale, timezone, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        preferredLocale: { type: string }
        timezone: { type: string }
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        createdAt: { type: string, format: date-time }

    CurrentUserResponse:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [roles, capabilities, settings]
          properties:
            phoneNumber: { type: [string, 'null'], maxLength: 32 }
            roles:
              type: array
              uniqueItems: true
              items: { $ref: '#/components/schemas/RoleCode' }
            capabilities:
              type: object
              required: [hasStudentProfile, hasTrainerProfile, canCoach]
              properties:
                hasStudentProfile: { type: boolean }
                hasTrainerProfile: { type: boolean }
                canCoach:
                  type: boolean
                  description: Derived from canonical coaching eligibility policy; requires active account, active TRAINER role, active profile, VERIFIED status, and ACTIVE activity status.
            settings: { $ref: '#/components/schemas/UserSettings' }

    UpdateCurrentUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 160 }
        phoneNumber: { type: [string, 'null'], maxLength: 32 }
        preferredLocale: { type: string, maxLength: 16 }
        timezone: { type: string, maxLength: 64 }
        settings: { $ref: '#/components/schemas/UpdateUserSettings' }

    UserSettings:
      type: object
      required: [weekStartsOn, measurementSystem, accessibilityPreferences, privacyPreferences]
      properties:
        weekStartsOn: { type: integer, minimum: 0, maximum: 6 }
        measurementSystem: { $ref: '#/components/schemas/MeasurementSystem' }
        accessibilityPreferences: { type: object, additionalProperties: true }
        privacyPreferences: { type: object, additionalProperties: true }

    UpdateUserSettings:
      type: object
      additionalProperties: false
      properties:
        weekStartsOn: { type: integer, minimum: 0, maximum: 6 }
        measurementSystem: { $ref: '#/components/schemas/MeasurementSystem' }
        accessibilityPreferences: { type: object, additionalProperties: true }
        privacyPreferences: { type: object, additionalProperties: true }

    UpsertStudentProfileRequest:
      type: object
      additionalProperties: false
      properties:
        dateOfBirth: { type: [string, 'null'], format: date }
        gender: { oneOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }] }
        trainingExperienceLevel:
          oneOf: [{ $ref: '#/components/schemas/TrainingExperienceLevel' }, { type: 'null' }]
        trainingExperienceMonths: { type: [number, 'null'], minimum: 0 }
        availableDaysPerWeek: { type: [integer, 'null'], minimum: 1, maximum: 7 }
        preferredSessionMinutes: { type: [integer, 'null'], minimum: 5, maximum: 480 }
        onboardingCompleted: { type: boolean, default: false }

    StudentProfileResponse:
      type: object
      additionalProperties: false
      required: [userId, createdAt, updatedAt]
      properties:
        userId: { type: string, format: uuid }
        dateOfBirth: { type: [string, 'null'], format: date }
        gender: { oneOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }] }
        trainingExperienceLevel:
          oneOf: [{ $ref: '#/components/schemas/TrainingExperienceLevel' }, { type: 'null' }]
        trainingExperienceMonths: { type: [number, 'null'], minimum: 0 }
        availableDaysPerWeek: { type: [integer, 'null'], minimum: 1, maximum: 7 }
        preferredSessionMinutes: { type: [integer, 'null'], minimum: 5, maximum: 480 }
        onboardingCompleted: { type: boolean }
        onboardingCompletedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTrainerProfileRequest:
      type: object
      additionalProperties: false
      properties:
        publicSlug:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 100
        bio: { type: [string, 'null'], maxLength: 4000 }
        yearsExperience: { type: [number, 'null'], minimum: 0, maximum: 99.99 }
        acceptingStudents: { type: boolean, default: false }

    UpdateTrainerProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        publicSlug:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 100
        bio: { type: [string, 'null'], maxLength: 4000 }
        yearsExperience: { type: [number, 'null'], minimum: 0, maximum: 99.99 }
        acceptingStudents: { type: boolean }

    TrainerProfileResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - verificationStatus
        - activityStatus
        - coachingEligibility
        - createdAt
        - updatedAt
      properties:
        userId: { type: string, format: uuid }
        publicSlug: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        yearsExperience: { type: [number, 'null'] }
        acceptingStudents: { type: boolean }
        verificationStatus: { $ref: '#/components/schemas/TrainerVerificationStatus' }
        activityStatus: { $ref: '#/components/schemas/TrainerActivityStatus' }
        coachingEligibility: { $ref: '#/components/schemas/CoachingEligibility' }
        verifiedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CoachingEligibility:
      type: object
      required: [eligible, blockingReasons]
      properties:
        eligible:
          type: boolean
          description: Derived from verification, activity, policy, and later relationship scope.
        blockingReasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - ACCOUNT_NOT_ACTIVE
              - TRAINER_ROLE_MISSING
              - PROFILE_NOT_FOUND
              - PROFILE_INACTIVE
              - APPLICATION_NOT_SUBMITTED
              - VERIFICATION_PENDING
              - VERIFICATION_REJECTED
              - VERIFICATION_EXPIRED
              - VERIFICATION_REVOKED
              - ACTIVITY_SUSPENDED
              - ACTIVITY_INACTIVE
              - POLICY_RESTRICTION

    SubmitTrainerApplicationRequest:
      type: object
      additionalProperties: false
      properties:
        certificateIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        documentMediaIds:
          type: array
          uniqueItems: true
          description: Optional identifiers of media uploaded through an authorized media workflow.
          items: { type: string, format: uuid }
        applicantNote: { type: [string, 'null'], maxLength: 2000 }

    TrainerApplicationResponse:
      type: object
      required: [id, trainerId, status, submittedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        trainerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TrainerVerificationStatus' }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        rejectionReason: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }

    DecideTrainerApplicationRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
          description: Verification decision.
        rejectionReason:
          type: [string, 'null']
          maxLength: 2000
          description: Mandatory explanation when decision is REJECT, must be omitted or null for APPROVE.
        reviewNotes:
          type: [string, 'null']
          maxLength: 2000
          description: Optional administrative notes visible only to admins.

    AdminTrainerApplicationResponse:
      type: object
      required: [id, trainerId, status, submittedAt, certificateIds, documentMediaIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        trainerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TrainerVerificationStatus' }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [string, 'null'], format: uuid }
        rejectionReason: { type: [string, 'null'] }
        reviewNotes: { type: [string, 'null'] }
        applicantNote: { type: [string, 'null'] }
        certificateIds:
          type: array
          items: { type: string, format: uuid }
        documentMediaIds:
          type: array
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminTrainerApplicationPageResponse:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminTrainerApplicationResponse'
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [errorCode, message, timestamp, requestId, fieldErrors]
      properties:
        errorCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples: [VALIDATION_FAILED]
        message: { type: string }
        timestamp: { type: string, format: date-time }
        requestId: { type: string }
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    AccountStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DISABLED, DELETION_PENDING, DELETED]
    RoleCode:
      type: string
      enum: [STUDENT, TRAINER, ADMIN, SUPER_ADMIN, USER_ADMIN, CONTENT_ADMIN, SUPPORT_ADMIN, MODERATION_ADMIN]
    MeasurementSystem:
      type: string
      enum: [METRIC, IMPERIAL]
    Gender:
      type: string
      enum: [MALE, FEMALE, NON_BINARY, OTHER, PREFER_NOT_TO_SAY]
    TrainingExperienceLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    TrainerVerificationStatus:
      type: string
      enum: [NOT_SUBMITTED, PENDING, VERIFIED, REJECTED, SUSPENDED]
    TrainerActivityStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]

    GoalLifecycleStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, COMPLETED, ENDED, ABANDONED, REPLACED, ARCHIVED]

    ObjectivePriority:
      type: string
      enum: [PRIMARY, SECONDARY]

    VersionLockReason:
      type: string
      enum: [APPROVED, ACTIVATED, SUPERSEDED, MIGRATED]

    CreateGoalObjectiveRequest:
      type: object
      required: [priority]
      properties:
        goalTypeId: { type: integer, format: int32 }
        goalTypeCode: { type: string }
        priority: { $ref: '#/components/schemas/ObjectivePriority' }
        sortOrder: { type: integer, minimum: 0 }
        notes: { type: string, maxLength: 2000 }

    CreateGoalTargetRequest:
      type: object
      properties:
        metricDefinitionId: { type: integer, format: int32 }
        metricCode: { type: string }
        exerciseVariationId: { type: string, format: uuid }
        startValue: { type: number, exclusiveMinimum: 0 }
        targetValue: { type: number, exclusiveMinimum: 0 }
        targetMinValue: { type: number, exclusiveMinimum: 0 }
        targetMaxValue: { type: number, exclusiveMinimum: 0 }
        unitId: { type: integer, format: int32 }
        unitCode: { type: string }
        targetRepetitions: { type: integer, minimum: 1 }
        targetDate: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }

    CreateFitnessGoalRequest:
      type: object
      required: [title, startDate, objectives]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        startDate:
          type: string
          format: date
        targetDate:
          type: string
          format: date
          description: Optional target date. When provided, must be strictly after startDate. If durationDays is also provided, targetDate must equal startDate + durationDays.
        durationDays:
          type: integer
          minimum: 1
          description: Optional duration in days. If targetDate is also provided, durationDays must equal the exact day difference between startDate and targetDate.
        activateImmediately:
          type: boolean
          default: false
        objectives:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateGoalObjectiveRequest'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/CreateGoalTargetRequest'

    ActivateFitnessGoalRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000

    PauseFitnessGoalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Reason for pausing the fitness goal
          example: Temporary injury recovery

    ResumeFitnessGoalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Reason for resuming the fitness goal
          example: Cleared to resume full training

    GoalObjectiveResponse:
      type: object
      required: [id, goalTypeId, goalTypeCode, goalTypeName, priority, sortOrder]
      properties:
        id: { type: string, format: uuid }
        goalTypeId: { type: integer, format: int32 }
        goalTypeCode: { type: string }
        goalTypeName: { type: string }
        priority: { $ref: '#/components/schemas/ObjectivePriority' }
        sortOrder: { type: integer }
        notes: { type: [string, 'null'] }

    GoalTargetResponse:
      type: object
      required: [id, metricDefinitionId, metricCode, metricDisplayName, unitId, unitCode, unitSymbol, createdAt]
      properties:
        id: { type: string, format: uuid }
        metricDefinitionId: { type: integer, format: int32 }
        metricCode: { type: string }
        metricDisplayName: { type: string }
        exerciseVariationId: { type: [string, 'null'], format: uuid }
        startValue: { type: [number, 'null'] }
        targetValue: { type: [number, 'null'] }
        targetMinValue: { type: [number, 'null'] }
        targetMaxValue: { type: [number, 'null'] }
        unitId: { type: integer, format: int32 }
        unitCode: { type: string }
        unitSymbol: { type: string }
        targetRepetitions: { type: [integer, 'null'] }
        targetDate: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    GoalVersionResponse:
      type: object
      required: [id, versionNumber, startDate, effectiveFrom, createdAt, isCurrent, objectives, targets]
      properties:
        id: { type: string, format: uuid }
        versionNumber: { type: integer }
        title: { type: [string, 'null'] }
        startDate: { type: string, format: date }
        targetDate: { type: [string, 'null'], format: date }
        durationDays: { type: [integer, 'null'] }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: [string, 'null'], format: date-time }
        resumeDate: { type: [string, 'null'], format: date }
        changeReason: { type: [string, 'null'] }
        changeSummary: { type: [string, 'null'] }
        createdBy: { type: string, format: uuid }
        sourceProposalId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        lockedAt: { type: [string, 'null'], format: date-time }
        lockedBy: { type: [string, 'null'], format: uuid }
        lockReason: { type: [string, 'null'] }
        isCurrent: { type: boolean }
        objectives:
          type: array
          items: { $ref: '#/components/schemas/GoalObjectiveResponse' }
        targets:
          type: array
          items: { $ref: '#/components/schemas/GoalTargetResponse' }

    GoalVersionPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GoalVersionResponse' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer, minimum: 0 }

    CreateGoalVersionRequest:
      type: object
      required: [changeReason, objectives]
      properties:
        title: { type: string, maxLength: 200 }
        startDate: { type: string, format: date }
        targetDate: { type: string, format: date }
        durationDays: { type: integer, minimum: 1 }
        changeReason: { type: string, maxLength: 100 }
        changeSummary: { type: string, maxLength: 2000 }
