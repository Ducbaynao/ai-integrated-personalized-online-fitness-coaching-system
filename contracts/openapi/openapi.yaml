    ExerciseFilterMetadataResponse:
      type: object
      additionalProperties: false
      required: [categories, muscleGroups, equipment, tags, difficulties, movementPatterns]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/CatalogOptionResponse' }
        muscleGroups:
          type: array
          items: { $ref: '#/components/schemas/MuscleGroupOptionResponse' }
        equipment:
          type: array
          items: { $ref: '#/components/schemas/CatalogOptionResponse' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/CatalogOptionResponse' }
        difficulties:
          type: array
          items: { $ref: '#/components/schemas/ExerciseDifficulty' }
        movementPatterns:
          type: array
          items: { type: string }

    ExerciseDifficulty:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]

    ExerciseMovementPattern:
      type: string
      enum: [SQUAT, HINGE, LUNGE, PUSH, PULL, CARRY, ROTATION, CORE_STABILITY, LOCOMOTION, ISOLATION, MOBILITY, BALANCE]

    ExerciseLifecycleStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]

    AdminExerciseMuscleInput:
      type: object
      additionalProperties: false
      required: [muscleGroupCode, involvement]
      properties:
        muscleGroupCode: { type: string, minLength: 1, maxLength: 60 }
        involvement: { type: string, enum: [PRIMARY, SECONDARY, STABILIZER] }

    AdminExerciseEquipmentInput:
      type: object
      additionalProperties: false
      required: [equipmentCode, requirement]
      properties:
        equipmentCode: { type: string, minLength: 1, maxLength: 60 }
        requirement: { type: string, enum: [REQUIRED, OPTIONAL, ALTERNATIVE] }

    AdminExerciseVariationInput:
      type: object
      additionalProperties: false
      required: [code, name, defaultVariation, active]
      properties:
        code: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: [string, 'null'] }
        instructions: { type: [string, 'null'] }
        difficulty:
          anyOf:
            - $ref: '#/components/schemas/ExerciseDifficulty'
            - type: 'null'
        defaultVariation: { type: boolean }
        active: { type: boolean }
        muscles:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AdminExerciseMuscleInput' }
        equipment:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AdminExerciseEquipmentInput' }

    AdminExerciseDraftRequest:
      type: object
      additionalProperties: false
      required: [code, name, unilateral]
      properties:
        code: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 180 }
        categoryCode: { type: [string, 'null'], maxLength: 60 }
        description: { type: [string, 'null'] }
        instructions: { type: [string, 'null'] }
        difficulty:
          anyOf:
            - $ref: '#/components/schemas/ExerciseDifficulty'
            - type: 'null'
        movementPattern:
          anyOf:
            - $ref: '#/components/schemas/ExerciseMovementPattern'
            - type: 'null'
        unilateral: { type: boolean }
        tagCodes:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 80 }
        variations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AdminExerciseVariationInput' }

    UpdateAdminExerciseRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, exercise]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        exercise: { $ref: '#/components/schemas/AdminExerciseDraftRequest' }

    ExerciseVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }

    ArchiveExerciseRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    CanonicalReplacementRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        targetExerciseId:
          type: [string, 'null']
          format: uuid
          description: Null clears the current canonical replacement.
        reason: { type: string, minLength: 1, maxLength: 1000 }

    CanonicalReplacementExerciseReference:
      type: object
      additionalProperties: false
      required: [id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/ExerciseLifecycleStatus' }

    CanonicalReplacementUsageImpact:
      type: object
      additionalProperties: false
      required: [availability, count]
      properties:
        availability:
          type: string
          enum: [NOT_AVAILABLE]
        count:
          type: ['integer', 'null']
          format: int64
          minimum: 0
          description: Null while usage impact is unavailable; absence is never represented as zero.

    CanonicalReplacementPreviewResponse:
      type: object
      additionalProperties: false
      required: [sourceExercise, expectedVersion, currentTarget, usageImpact]
      properties:
        sourceExercise: { $ref: '#/components/schemas/CanonicalReplacementExerciseReference' }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        currentTarget:
          anyOf:
            - $ref: '#/components/schemas/CanonicalReplacementExerciseReference'
            - type: 'null'
        usageImpact: { $ref: '#/components/schemas/CanonicalReplacementUsageImpact' }

    AdminExerciseVariationResponse:
      type: object
      additionalProperties: false
      required: [id, code, name, defaultVariation, active, muscles, equipment]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: [string, 'null'] }
        instructions: { type: [string, 'null'] }
        difficulty:
          anyOf:
            - $ref: '#/components/schemas/ExerciseDifficulty'
            - type: 'null'
        defaultVariation: { type: boolean }
        active: { type: boolean }
        muscles:
          type: array
          items: { $ref: '#/components/schemas/AdminExerciseMuscleInput' }
        equipment:
          type: array
          items: { $ref: '#/components/schemas/AdminExerciseEquipmentInput' }

    AdminExerciseResponse:
      type: object
      additionalProperties: false
      required: [id, code, name, unilateral, status, version, tagCodes, variations, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        categoryCode: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        instructions: { type: [string, 'null'] }
        difficulty:
          anyOf:
            - $ref: '#/components/schemas/ExerciseDifficulty'
            - type: 'null'
        movementPattern:
          anyOf:
            - $ref: '#/components/schemas/ExerciseMovementPattern'
            - type: 'null'
        unilateral: { type: boolean }
        status: { $ref: '#/components/schemas/ExerciseLifecycleStatus' }
        version: { type: integer, format: int64, minimum: 0 }
        canonicalReplacementId: { type: [string, 'null'], format: uuid }
        tagCodes: { type: array, items: { type: string } }
        variations:
          type: array
          items: { $ref: '#/components/schemas/AdminExerciseVariationResponse' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminExerciseSummaryResponse:
      type: object
      additionalProperties: false
      required: [id, code, name, status, version, muscleGroupCodes, equipmentCodes, mediaAvailable, variationCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        categoryCode: { type: [string, 'null'] }
        difficulty:
          anyOf:
            - $ref: '#/components/schemas/ExerciseDifficulty'
            - type: 'null'
        movementPattern:
          anyOf:
            - $ref: '#/components/schemas/ExerciseMovementPattern'
            - type: 'null'
        status: { $ref: '#/components/schemas/ExerciseLifecycleStatus' }
        version: { type: integer, format: int64, minimum: 0 }
        canonicalReplacementId: { type: [string, 'null'], format: uuid }
        muscleGroupCodes:
          type: array
          uniqueItems: true
          description: Deterministically ordered muscle-group codes used across this Exercise's variations.
          items: { type: string }
        equipmentCodes:
          type: array
          uniqueItems: true
          description: Deterministically ordered equipment codes used across this Exercise's variations.
          items: { type: string }
        mediaAvailable:
          type: boolean
          description: True only when at least one linked media file is clean and not deleted; storage references are not exposed.
        variationCount: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }

    AdminExercisePageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminExerciseSummaryResponse' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    AdminExerciseFormMetadataResponse:
      type: object
      additionalProperties: false
      required: [categories, muscleGroups, equipment, tags, difficulties, movementPatterns]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/CatalogOptionResponse' }
        muscleGroups:
          type: array
          items: { $ref: '#/components/schemas/MuscleGroupOptionResponse' }
        equipment:
          type: array
          items: { $ref: '#/components/schemas/CatalogOptionResponse' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/CatalogOptionResponse' }
        difficulties:
          type: array
          items: { $ref: '#/components/schemas/ExerciseDifficulty' }
        movementPatterns:
          type: array
          items: { $ref: '#/components/schemas/CatalogOptionResponse' }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [errorCode, message, timestamp, requestId, fieldErrors]
      properties:
        errorCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples: [VALIDATION_FAILED]
        message: { type: string }
        timestamp: { type: string, format: date-time }
        requestId: { type: string }
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    AccountStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DISABLED, DELETION_PENDING, DELETED]
    RoleCode:
      type: string
      enum: [STUDENT, TRAINER, ADMIN, SUPER_ADMIN, USER_ADMIN, CONTENT_ADMIN, SUPPORT_ADMIN, MODERATION_ADMIN]
    MeasurementSystem:
      type: string
      enum: [METRIC, IMPERIAL]
    Gender:
      type: string
      enum: [MALE, FEMALE, NON_BINARY, OTHER, PREFER_NOT_TO_SAY]
    TrainingExperienceLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    TrainerVerificationStatus:
      type: string
      enum: [NOT_SUBMITTED, PENDING, VERIFIED, REJECTED, SUSPENDED]
    TrainerActivityStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]

    GoalLifecycleStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, COMPLETED, ENDED, ABANDONED, REPLACED, ARCHIVED]

    ObjectivePriority:
      type: string
      enum: [PRIMARY, SECONDARY]

    VersionLockReason:
      type: string
      enum: [APPROVED, ACTIVATED, SUPERSEDED, MIGRATED]

    CreateGoalObjectiveRequest:
      type: object
      required: [priority]
      properties:
        goalTypeId: { type: integer, format: int32 }
        goalTypeCode: { type: string }
        priority: { $ref: '#/components/schemas/ObjectivePriority' }
        sortOrder: { type: integer, minimum: 0 }
        notes: { type: string, maxLength: 2000 }

    CreateGoalTargetRequest:
      type: object
      properties:
        metricDefinitionId: { type: integer, format: int32 }
        metricCode: { type: string }
        exerciseVariationId: { type: string, format: uuid }
        startValue: { type: number, exclusiveMinimum: 0 }
        targetValue: { type: number, exclusiveMinimum: 0 }
        targetMinValue: { type: number, exclusiveMinimum: 0 }
        targetMaxValue: { type: number, exclusiveMinimum: 0 }
        unitId: { type: integer, format: int32 }
        unitCode: { type: string }
        targetRepetitions: { type: integer, minimum: 1 }
        targetDate: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }

    CreateFitnessGoalRequest:
      type: object
      required: [title, startDate, objectives]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        startDate:
          type: string
          format: date
        targetDate:
          type: string
          format: date
          description: Optional target date. When provided, must be strictly after startDate. If durationDays is also provided, targetDate must equal startDate + durationDays.
        durationDays:
          type: integer
          minimum: 1
          description: Optional duration in days. If targetDate is also provided, durationDays must equal the exact day difference between startDate and targetDate.
        activateImmediately:
          type: boolean
          default: false
        objectives:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateGoalObjectiveRequest'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/CreateGoalTargetRequest'

    ActivateFitnessGoalRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000

    PauseFitnessGoalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Reason for pausing the fitness goal
          example: Temporary injury recovery

    ResumeFitnessGoalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Reason for resuming the fitness goal
          example: Cleared to resume full training

    GoalObjectiveResponse:
      type: object
      required: [id, goalTypeId, goalTypeCode, goalTypeName, priority, sortOrder]
      properties:
        id: { type: string, format: uuid }
        goalTypeId: { type: integer, format: int32 }
        goalTypeCode: { type: string }
        goalTypeName: { type: string }
        priority: { $ref: '#/components/schemas/ObjectivePriority' }
        sortOrder: { type: integer }
        notes: { type: [string, 'null'] }

    GoalTargetResponse:
      type: object
      required: [id, metricDefinitionId, metricCode, metricDisplayName, unitId, unitCode, unitSymbol, createdAt]
      properties:
        id: { type: string, format: uuid }
        metricDefinitionId: { type: integer, format: int32 }
        metricCode: { type: string }
        metricDisplayName: { type: string }
        exerciseVariationId: { type: [string, 'null'], format: uuid }
        startValue: { type: [number, 'null'] }
        targetValue: { type: [number, 'null'] }
        targetMinValue: { type: [number, 'null'] }
        targetMaxValue: { type: [number, 'null'] }
        unitId: { type: integer, format: int32 }
        unitCode: { type: string }
        unitSymbol: { type: string }
        targetRepetitions: { type: [integer, 'null'] }
        targetDate: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    GoalVersionResponse:
      type: object
      required: [id, versionNumber, startDate, effectiveFrom, createdAt, isCurrent, objectives, targets]
      properties:
        id: { type: string, format: uuid }
        versionNumber: { type: integer }
        title: { type: [string, 'null'] }
        startDate: { type: string, format: date }
        targetDate: { type: [string, 'null'], format: date }
        durationDays: { type: [integer, 'null'] }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: [string, 'null'], format: date-time }
        resumeDate: { type: [string, 'null'], format: date }
        changeReason: { type: [string, 'null'] }
        changeSummary: { type: [string, 'null'] }
        createdBy: { type: string, format: uuid }
        sourceProposalId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        lockedAt: { type: [string, 'null'], format: date-time }
        lockedBy: { type: [string, 'null'], format: uuid }
        lockReason: { type: [string, 'null'] }
        isCurrent: { type: boolean }
        objectives:
          type: array
          items: { $ref: '#/components/schemas/GoalObjectiveResponse' }
        targets:
          type: array
          items: { $ref: '#/components/schemas/GoalTargetResponse' }

    GoalVersionPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GoalVersionResponse' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer, minimum: 0 }

    CreateGoalVersionRequest:
      type: object
      required: [changeReason, objectives]
      properties:
        title: { type: string, maxLength: 200 }
        startDate: { type: string, format: date }
        targetDate: { type: string, format: date }
        durationDays: { type: integer, minimum: 1 }
        changeReason: { type: string, maxLength: 100 }
        changeSummary: { type: string, maxLength: 2000 }
        objectives:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateGoalObjectiveRequest' }
        targets:
          type: array
          items: { $ref: '#/components/schemas/CreateGoalTargetRequest' }

    CreateGoalTransitionRequest:
      type: object
      required: [title, startDate, transitionReason, objectives]
      properties:
        title: { type: string, maxLength: 200 }
        startDate: { type: string, format: date }
        targetDate: { type: string, format: date }
        durationDays: { type: integer, minimum: 1 }
        transitionReason: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 2000 }
        objectives:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateGoalObjectiveRequest' }
        targets:
          type: array
          items: { $ref: '#/components/schemas/CreateGoalTargetRequest' }

    GoalTransitionResponse:
      type: object
      required: [id, previousGoalId, newGoalId, transitionReason, initiatedBy, transitionedAt]
      properties:
        id: { type: string, format: uuid }
        previousGoalId: { type: string, format: uuid }
        newGoalId: { type: string, format: uuid }
        transitionReason: { type: string }
        proposalId: { type: [string, 'null'], format: uuid }
        initiatedBy: { type: string, format: uuid }
        transitionedAt: { type: string, format: date-time }
        notes: { type: [string, 'null'] }
        newGoal: { $ref: '#/components/schemas/FitnessGoalResponse' }

    FitnessGoalResponse:
      type: object
      required: [id, studentId, title, status, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: '#/components/schemas/GoalLifecycleStatus' }
        createdBy: { type: string, format: uuid }
        activatedAt: { type: [string, 'null'], format: date-time }
        pausedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        statusReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        currentVersion: { $ref: '#/components/schemas/GoalVersionResponse' }

    FitnessGoalPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FitnessGoalResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    ProposalStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, CANCELLED, EXPIRED]

    ProposalSource:
      type: string
      enum: [STUDENT, TRAINER, AI_ASSISTANCE, SYSTEM]

    ProposalDecision:
      type: string
      enum: [ACCEPT, REJECT]

    CreateGoalProposalRequest:
      type: object
      required: [reason, objectives]
      properties:
        proposedTitle: { type: [string, 'null'], maxLength: 200 }
        proposedStartDate: { type: [string, 'null'], format: date }
        proposedTargetDate: { type: [string, 'null'], format: date }
        proposedDurationDays: { type: [integer, 'null'], minimum: 1 }
        reason: { type: string }
        expiresAt: { type: [string, 'null'], format: date-time }
        objectives:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateGoalObjectiveRequest' }
        targets:
          type: array
          items: { $ref: '#/components/schemas/CreateGoalTargetRequest' }

    DecideGoalProposalRequest:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/ProposalDecision' }
        decisionNote: { type: [string, 'null'], maxLength: 2000 }

    GoalProposalObjectiveResponse:
      type: object
      required: [id, goalTypeId, goalTypeCode, goalTypeName, priority, sortOrder]
      properties:
        id: { type: string, format: uuid }
        goalTypeId: { type: integer }
        goalTypeCode: { type: string }
        goalTypeName: { type: string }
        priority: { $ref: '#/components/schemas/ObjectivePriority' }
        sortOrder: { type: integer }
        notes: { type: [string, 'null'] }

    GoalProposalTargetResponse:
      type: object
      required: [id, metricDefinitionId, metricCode, metricDisplayName, unitId, unitCode, unitSymbol]
      properties:
        id: { type: string, format: uuid }
        metricDefinitionId: { type: integer }
        metricCode: { type: string }
        metricDisplayName: { type: string }
        exerciseVariationId: { type: [string, 'null'], format: uuid }
        startValue: { type: [number, 'null'] }
        targetValue: { type: [number, 'null'] }
        targetMinValue: { type: [number, 'null'] }
        targetMaxValue: { type: [number, 'null'] }
        unitId: { type: integer }
        unitCode: { type: string }
        unitSymbol: { type: string }
        targetRepetitions: { type: [integer, 'null'] }
        targetDate: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'] }

    GoalProposalResponse:
      type: object
      required: [id, studentId, fitnessGoalId, source, reason, status, createdAt, updatedAt, objectives, targets]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        fitnessGoalId: { type: string, format: uuid }
        baseGoalVersionId: { type: [string, 'null'], format: uuid }
        source: { $ref: '#/components/schemas/ProposalSource' }
        createdBy: { type: string, format: uuid }
        proposedTitle: { type: [string, 'null'] }
        proposedStartDate: { type: [string, 'null'], format: date }
        proposedTargetDate: { type: [string, 'null'], format: date }
        proposedDurationDays: { type: [integer, 'null'] }
        reason: { type: string }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        decidedBy: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        objectives:
          type: array
          items: { $ref: '#/components/schemas/GoalProposalObjectiveResponse' }
        targets:
          type: array
          items: { $ref: '#/components/schemas/GoalProposalTargetResponse' }
        baseVersion: { $ref: '#/components/schemas/GoalVersionResponse' }

    GoalProposalPageResponse:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GoalProposalResponse' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

security:
  - bearerAuth: []
