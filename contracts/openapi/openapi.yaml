      tags: [Workout Plan]
      operationId: recordPlannedWorkoutOccurrenceAdjustment
      summary: Append one occurrence-scoped adjustment
      description: This endpoint never changes the plan template or any other occurrence.
      parameters: [{ $ref: '#/components/parameters/PlannedWorkoutOccurrenceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutOccurrenceAdjustmentRequest' } } }
      responses:
        '200':
          description: Idempotent replay of the recorded occurrence adjustment; adjustmentId is null
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutOccurrenceAdjustmentResponse' } } }
        '201':
          description: Adjustment appended
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutOccurrenceAdjustmentResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }

  /planned-workouts/{occurrenceId}/executions:
    post:
      tags: [Workout Execution]
      operationId: startWorkoutExecution
      summary: Start one Planned Workout execution from an immutable frozen snapshot
      description: >-
        For a COACH_REQUIRED occurrence, START requires a currently CONFIRMED
        Appointment linked to the occurrence, with matching Student, Trainer
        and effective HUMAN_COACH period. The complete planned workout interval
        must fit inside the Appointment interval, and PostgreSQL time at START
        must be inside that Appointment interval. Missing legacy identity/end,
        a COMPLETED Appointment or an old supervision override alone cannot
        authorize a new START. SKIP remains a separate occurrence command.
      parameters: [{ $ref: '#/components/parameters/WorkoutExecutionOccurrenceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartWorkoutExecutionRequest' } } }
      responses:
        '201':
          description: Workout execution started, or the same logical start replayed
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutExecutionDetail' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutExecutionForbidden' }
        '404': { $ref: '#/components/responses/WorkoutExecutionConcealed' }
        '409': { $ref: '#/components/responses/WorkoutExecutionConflict' }

  /planned-workouts/{occurrenceId}/skip:
    post:
      tags: [Workout Execution]
      operationId: skipPlannedWorkout
      summary: Skip one not-yet-started Planned Workout occurrence
      parameters: [{ $ref: '#/components/parameters/WorkoutExecutionOccurrenceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkipPlannedWorkoutRequest' } } }
      responses:
        '200':
          description: Planned Workout skipped, or the same logical skip replayed
          content: { application/json: { schema: { $ref: '#/components/schemas/SkipPlannedWorkoutResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutExecutionForbidden' }
        '404': { $ref: '#/components/responses/WorkoutExecutionConcealed' }
        '409': { $ref: '#/components/responses/WorkoutExecutionConflict' }

  /workout-executions/current:
    get:
      tags: [Workout Execution]
      operationId: getCurrentWorkoutExecution
      summary: Get the authenticated Student's in-progress Workout Execution
      responses:
        '200': { description: Current execution, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutExecutionDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutExecutionForbidden' }
        '404': { $ref: '#/components/responses/WorkoutExecutionConcealed' }

  /workout-executions:
    get:
      tags: [Workout Execution]
      operationId: listWorkoutExecutions
      summary: List authority-scoped Workout Execution history
      description: >-
