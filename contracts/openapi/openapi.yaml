        '400': { $ref: '#/components/responses/WorkoutScheduleChangeValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutScheduleChangeForbidden' }
        '404': { $ref: '#/components/responses/WorkoutScheduleChangeConcealed' }
        '409': { $ref: '#/components/responses/WorkoutScheduleChangeConflict' }

  /planned-workouts/{occurrenceId}/adjustments:
