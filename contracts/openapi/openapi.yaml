          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fitness goal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }

  /fitness-goals/{goalId}/activate:
    post:
      tags: [Fitness Goal]
      operationId: activateFitnessGoal
      summary: Activate a draft fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateFitnessGoalRequest'
      responses:
        '200':
          description: Fitness goal activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /fitness-goals/{goalId}/pause:
    post:
      tags: [Fitness Goal]
      operationId: pauseFitnessGoal
      summary: Pause an active fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseFitnessGoalRequest'
      responses:
        '200':
          description: Fitness goal paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Only owning student may pause personal fitness goal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Fitness goal or student profile not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflict - Goal is not in ACTIVE status or concurrent modification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goals/{goalId}/resume:
    post:
      tags: [Fitness Goal]
      operationId: resumeFitnessGoal
      summary: Resume a paused fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeFitnessGoalRequest'
      responses:
        '200':
          description: Fitness goal resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessGoalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Only owning student may resume personal fitness goal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Fitness goal or student profile not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflict - Goal is not in PAUSED status, active goal already exists, or concurrent modification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goals/{goalId}/versions:
    get:
      tags: [Fitness Goal]
      operationId: getGoalVersions
      summary: List version history for a fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated goal versions ordered newest to oldest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalVersionPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
    post:
      tags: [Fitness Goal]
      operationId: createGoalVersion
      summary: Create a new same-journey version for an active fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalVersionRequest'
      responses:
        '201':
          description: Goal version created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalVersionResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
        '409':
          description: >-
            Conflict - Goal version conflict or concurrent modification (GOAL_VERSION_CONFLICT),
            new goal journey required (NEW_GOAL_JOURNEY_REQUIRED),
            no changes detected (GOAL_VERSION_NO_CHANGES),
            or invalid lifecycle transition (INVALID_LIFECYCLE_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fitness-goals/{goalId}/versions/{versionId}:
    get:
      tags: [Fitness Goal]
      operationId: getGoalVersionDetail
      summary: Get details of a specific fitness goal version
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Goal version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalVersionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/GoalVersionNotFound' }

  /fitness-goals/{goalId}/transitions:
    get:
      tags: [Fitness Goal]
      operationId: getGoalTransitions
      summary: List transition history for a fitness goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of goal transitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalTransitionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
    post:
      tags: [Fitness Goal]
      operationId: createGoalTransition
      summary: Transition an active fitness goal to a new journey
      description: >-
        Transitions an active fitness goal to REPLACED and creates a new goal starting at Version 1
        with a different PRIMARY goal type, preserving all history.
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalTransitionRequest'
      responses:
        '201':
          description: Goal transition created and new goal activated
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalTransitionResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
        '409':
          description: >-
            Conflict - Same goal journey not permitted (SAME_GOAL_JOURNEY_NOT_PERMITTED),
            goal transition conflict (GOAL_TRANSITION_CONFLICT),
            or invalid lifecycle transition (INVALID_LIFECYCLE_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fitness-goals/{goalId}/transitions/{transitionId}:
    get:
      tags: [Fitness Goal]
      operationId: getGoalTransitionDetail
      summary: Get details of a specific goal transition
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: transitionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Goal transition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalTransitionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Access denied (ACCESS_DENIED) or account unavailable (ACCOUNT_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Goal transition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fitness-goals/{goalId}/proposals:
    post:
      tags: [Fitness Goal Proposal]
      operationId: createGoalProposal
      summary: Create a goal proposal for an active student fitness goal
      description: >-
        Allows an authorized, eligible Trainer with an active coaching relationship,
        active human coaching period, and active FITNESS_GOAL sharing permission at
        CONTRIBUTE or MANAGE to propose modifications to an active fitness goal.
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalProposalRequest'
      responses:
        '201':
          description: Goal proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden codes include TRAINER_NOT_ELIGIBLE, COACHING_RELATIONSHIP_REQUIRED,
            DATA_SHARING_PERMISSION_REQUIRED, and DATA_SHARING_ACCESS_LEVEL_INSUFFICIENT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/FitnessGoalNotFound' }
        '409':
          description: Conflict - Fitness goal is not in ACTIVE status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goal-proposals/me:
    get:
      tags: [Fitness Goal Proposal]
      operationId: getMyGoalProposals
      summary: List fitness goal proposals for the authenticated student
      parameters:
        - name: fitnessGoalId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProposalStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of goal proposals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }

  /fitness-goal-proposals/{proposalId}:
    get:
      tags: [Fitness Goal Proposal]
      operationId: getGoalProposalDetail
      summary: Get goal proposal detail with current-versus-proposed comparison data
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Goal proposal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            Forbidden - requester is not the proposal Student or creator Trainer, or the creator
            Trainer lacks current FITNESS_GOAL VIEW authority. Codes include
            GOAL_PROPOSAL_ACCESS_DENIED, TRAINER_NOT_ELIGIBLE, COACHING_RELATIONSHIP_REQUIRED,
            DATA_SHARING_PERMISSION_REQUIRED, and DATA_SHARING_ACCESS_LEVEL_INSUFFICIENT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Goal proposal not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fitness-goal-proposals/{proposalId}/decisions:
    post:
      tags: [Fitness Goal Proposal]
      operationId: decideGoalProposal
      summary: Accept or reject a fitness goal proposal
      description: >-
        Allows the owning student to ACCEPT or REJECT a pending goal proposal.
        ACCEPT atomically creates a new same-journey fitness goal version (if primary goal type matches)
        or transitions the previous goal to REPLACED and creates a new goal starting at Version 1 (if primary goal type changes).
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideGoalProposalRequest'
      responses:
        '200':
          description: Goal proposal decided successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '400':
          description: Bad Request - Invalid decision format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Forbidden - Only owning student may decide personal goal proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not Found - Goal proposal not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: >-
            Conflict - Goal proposal already decided (GOAL_PROPOSAL_ALREADY_DECIDED),
            expired (GOAL_PROPOSAL_EXPIRED), base goal version is stale (STALE_GOAL_PROPOSAL),
            proposed primary goal type differs from base journey (NEW_GOAL_JOURNEY_REQUIRED),
            or proposed version contains no changes (GOAL_VERSION_NO_CHANGES).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workout-plans:
    get:
      tags: [Workout Plan]
      operationId: listVisibleWorkoutPlans
      summary: List actor-visible Workout Plans
      description: >-
        A Student lists their own plans. A Trainer must retain current WORKOUT_PLAN VIEW authority;
        historical items additionally require WORKOUT_PLAN_HISTORY VIEW. Former Trainers and unrelated
        actors receive no recoverable plan history.
      parameters:
        - name: studentId
          in: query
          schema: { type: string, format: uuid }
          description: Defaults to the authenticated actor; Trainers use it to select the current Student.
        - { $ref: '#/components/parameters/WorkoutPlanPage' }
        - { $ref: '#/components/parameters/WorkoutPlanSize' }
      responses:
        '200':
          description: Stable created-at descending page of visible plans
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanPage' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Workout Plan]
      operationId: createWorkoutPlanDraft
      summary: Create a Workout Plan draft
      description: SELF_DIRECTED Students create Student-owned drafts; the current HUMAN_COACH Trainer requires WORKOUT_PLAN MANAGE.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateWorkoutPlanDraftRequest' } } }
      responses:
        '201':
          description: Draft created
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /workout-plans/current:
    get:
      tags: [Workout Plan]
      operationId: getCurrentWorkoutPlan
      summary: Get the Student's ACTIVE Workout Plan
      parameters:
        - name: studentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Current ACTIVE plan, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
  /workout-plans/{planId}:
    get:
      tags: [Workout Plan]
      operationId: getWorkoutPlan
      summary: Get an actor-visible Workout Plan
      parameters: [{ $ref: '#/components/parameters/WorkoutPlanId' }]
      responses:
        '200': { description: Plan detail, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
  /workout-plans/{planId}/draft:
    put:
      tags: [Workout Plan]
      operationId: updateWorkoutPlanDraft
      summary: Replace the editable DRAFT snapshot
      parameters: [{ $ref: '#/components/parameters/WorkoutPlanId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWorkoutPlanDraftRequest' } } }
      responses:
        '200': { description: Draft replaced, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /workout-plans/{planId}/activate:
    post:
      tags: [Workout Plan]
      operationId: activateWorkoutPlan
      summary: Activate the initial locked version using the DB timestamp
      parameters: [{ $ref: '#/components/parameters/WorkoutPlanId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanVersionedCommandRequest' } } }
      responses:
        '200': { description: Plan activated, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /workout-plans/{planId}/transitions:
    post:
      tags: [Workout Plan]
      operationId: transitionWorkoutPlan
      summary: Apply one approved lifecycle transition
      description: Invalid edges and every transition out of ARCHIVED return WORKOUT_PLAN_LIFECYCLE_CONFLICT.
      parameters: [{ $ref: '#/components/parameters/WorkoutPlanId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransitionWorkoutPlanRequest' } } }
      responses:
        '200': { description: Lifecycle transitioned, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /workout-plans/{planId}/versions:
    get:
      tags: [Workout Plan]
      operationId: listWorkoutPlanVersions
      summary: List visible immutable version history
      parameters:
        - { $ref: '#/components/parameters/WorkoutPlanId' }
        - { $ref: '#/components/parameters/WorkoutPlanPage' }
        - { $ref: '#/components/parameters/WorkoutPlanSize' }
      responses:
        '200': { description: Version-number descending page, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanVersionPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
    post:
      tags: [Workout Plan]
      operationId: publishWorkoutPlanVersion
      summary: Atomically publish a significant complete replacement version
      description: >-
        Uses one authoritative DB boundary to close the previous version and open the immutable successor.
        Already-materialized Planned Workouts are never rewritten. No client effective timestamp is accepted.
      parameters: [{ $ref: '#/components/parameters/WorkoutPlanId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishWorkoutPlanVersionRequest' } } }
      responses:
        '201':
          description: Version published
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /workout-plans/{planId}/versions/{versionId}:
    get:
      tags: [Workout Plan]
      operationId: getWorkoutPlanVersion
      summary: Get one visible version with sessions and prescriptions
      description: Archived Exercise references retain historical presentation and canonical replacement metadata when available.
      parameters:
        - { $ref: '#/components/parameters/WorkoutPlanId' }
        - { $ref: '#/components/parameters/WorkoutPlanVersionId' }
      responses:
        '200': { description: Version detail, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanVersionDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
  /workout-plans/successors:
    post:
      tags: [Workout Plan]
      operationId: createStudentWorkoutPlanSuccessor
      summary: Create a Student-owned SELF_DIRECTED successor from a Trainer-delivered locked version
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateWorkoutPlanSuccessorRequest' } } }
      responses:
        '201':
          description: Successor draft created with explicit lineage
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanCommandResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }
  /planned-workouts/{occurrenceId}/adjustments:
    post:
      tags: [Workout Plan]
      operationId: recordPlannedWorkoutOccurrenceAdjustment
      summary: Append one occurrence-scoped adjustment
      description: This endpoint never changes the plan template or any other occurrence.
      parameters: [{ $ref: '#/components/parameters/PlannedWorkoutOccurrenceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutOccurrenceAdjustmentRequest' } } }
      responses:
        '200':
          description: Idempotent replay of the recorded occurrence adjustment; adjustmentId is null
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutOccurrenceAdjustmentResponse' } } }
        '201':
          description: Adjustment appended
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutOccurrenceAdjustmentResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkoutPlanForbidden' }
        '404': { $ref: '#/components/responses/WorkoutPlanConcealed' }
        '409': { $ref: '#/components/responses/WorkoutPlanConflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkoutPlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkoutPlanVersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlannedWorkoutOccurrenceId:
      name: occurrenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkoutPlanPage:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    WorkoutPlanSize:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CoachingRelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CoachingPage:
      name: page
      in: query
      schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    CoachingSize:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CoachingSharingPermissionId:
      name: permissionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    WorkoutPlanConcealed:
      description: >-
        Plan, version, or occurrence is absent or concealed. Codes include WORKOUT_PLAN_NOT_FOUND,
        WORKOUT_PLAN_VERSION_NOT_FOUND, and PLANNED_WORKOUT_NOT_FOUND.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    WorkoutPlanForbidden:
      description: >-
        Current ownership or Coaching authority is insufficient. Codes include WORKOUT_PLAN_ACCESS_DENIED
        and COACHING_PERIOD_REQUIRED. Trainer mutations require WORKOUT_PLAN MANAGE; current reads require VIEW.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    WorkoutPlanConflict:
      description: >-
        Stable codes include WORKOUT_PLAN_LIFECYCLE_CONFLICT, ACTIVE_WORKOUT_PLAN_ALREADY_EXISTS,
        WORKOUT_PLAN_VERSION_CONFLICT, PLANNED_WORKOUT_VERSION_CONFLICT, WORKOUT_PLAN_IDEMPOTENCY_CONFLICT,
        WORKOUT_PLAN_IMMUTABLE, WORKOUT_PLAN_SUCCESSOR_REQUIRED, WORKOUT_PLAN_EXERCISE_UNAVAILABLE,
        and WORKOUT_PLAN_EFFECTIVE_TIME_CONFLICT. A replay with the same actor, commandKey, command type,
        and logical payload returns the original domain effect; reuse with another payload conflicts.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    CoachingOutcome:
      description: Current lifecycle outcome; null fields mean no current relationship, resume request, or period
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CoachingOutcome' }
    CoachingRelationshipPage:
      description: Stable requested-at descending page of pending relationships
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CoachingRelationshipPage' }
    TrainerDirectoryPage:
      description: Stable display-name ascending page of discoverable Trainer summaries
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TrainerDirectoryPage' }
    CoachingHistoryPage:
      description: Stable changed-at descending page of status events
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CoachingHistoryPage' }
    CoachingResumePage:
      description: Stable requested-at descending page of resume-request decisions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CoachingResumePage' }
    CoachingPeriodPage:
      description: Stable started-at descending page of periods
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CoachingPeriodPage' }
    CoachingSharingPermission:
      description: Persisted sharing decision, including version and revocation evidence
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CoachingSharingPermission' }
    CoachingSharingPermissionPage:
      description: Stable valid-from descending page of immutable sharing decisions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CoachingSharingPermissionPage' }
    CoachingSharingConcealed:
      description: Permission or relationship is absent or concealed; codes include DATA_SHARING_PERMISSION_NOT_FOUND and COACHING_RELATIONSHIP_NOT_FOUND.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CoachingSharingConflict:
      description: >-
        Stable 409 codes include DATA_SHARING_PERMISSION_CONFLICT,
        COACHING_RELATIONSHIP_STATE_CONFLICT, and COACHING_IDEMPOTENCY_CONFLICT.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CoachingConcealed:
      description: >-
        Relationship, resume request, or counterparty is absent or concealed from this actor.
        Codes include COACHING_RELATIONSHIP_NOT_FOUND, COACHING_RESUME_REQUEST_NOT_FOUND,
        and COACHING_COUNTERPARTY_NOT_FOUND.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CoachingForbidden:
      description: >-
        Account/capability/Trainer eligibility or participant action is unavailable.
        Codes include ACCOUNT_UNAVAILABLE, STUDENT_CAPABILITY_UNAVAILABLE,
        TRAINER_CAPABILITY_UNAVAILABLE, TRAINER_NOT_ELIGIBLE, ACCESS_DENIED,
        COACHING_COUNTERPARTY_REQUIRED, and COACHING_INITIATOR_REQUIRED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CoachingConflict:
      description: >-
        Stable 409 codes include COACHING_VERSION_CONFLICT, COACHING_RELATIONSHIP_STATE_CONFLICT,
        COACHING_REQUEST_ALREADY_PENDING, COACHING_STUDENT_ALREADY_ASSIGNED,
        COACHING_RESUME_ALREADY_PENDING, COACHING_RESUME_REQUEST_STATE_CONFLICT,
        COACHING_RESUME_REQUEST_VERSION_CONFLICT, COACHING_PERIOD_CONFLICT,
        and COACHING_IDEMPOTENCY_CONFLICT. A matching actor commandKey and payload returns
        the recorded relationship/resume outcome without another side effect; currentPeriod is
        re-projected under current authority. A reused key with different payload conflicts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCredentials:
      description: Email or password is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AccountUnavailable:
      description: Account state does not permit the requested operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidRefreshToken:
      description: Refresh token is invalid, expired, revoked, or reused
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidOrExpiredOneTimeToken:
      description: One-time token is invalid, expired, or already consumed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    EmailAlreadyRegistered:
      description: Email already belongs to an account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ProfileNotFound:
      description: Requested capability profile does not exist for this User
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ActiveFitnessGoalAlreadyExists:
      description: An active fitness goal already exists for this student (ACTIVE_FITNESS_GOAL_ALREADY_EXISTS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    FitnessGoalNotFound:
      description: Fitness goal not found (FITNESS_GOAL_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GoalVersionNotFound:
      description: Goal version not found (GOAL_VERSION_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GoalVersionConflict:
      description: Goal version conflict or concurrent modification (GOAL_VERSION_CONFLICT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    WorkoutPlanStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, COMPLETED, ARCHIVED]
    WorkoutPlanDecisionOwnerType:
      type: string
      enum: [STUDENT, TRAINER]
    WorkoutPlanReadContext:
      type: string
      enum: [CURRENT, HISTORICAL]
    WorkoutPlanExercisePresentationState:
      type: string
      enum: [ACTIVE, ARCHIVED, UNAVAILABLE]
    WorkoutPlanPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkoutPlanSummary' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    WorkoutPlanVersionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkoutPlanVersionSummary' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    WorkoutPlanSummary:
      type: object
      additionalProperties: false
      required: [id, studentId, name, source, status, aggregateVersion, decisionOwnerType,
        decisionOwnerId, createdAt, updatedAt, readContext]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        fitnessGoalId: { type: [string, 'null'], format: uuid }
        coachingPeriodId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        source: { type: string }
        status: { $ref: '#/components/schemas/WorkoutPlanStatus' }
        aggregateVersion: { type: integer, format: int64, minimum: 0 }
        decisionOwnerType: { $ref: '#/components/schemas/WorkoutPlanDecisionOwnerType' }
        decisionOwnerId: { type: string, format: uuid }
        basedOnPlanId: { type: [string, 'null'], format: uuid }
        basedOnPlanVersionId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
        currentVersionId: { type: [string, 'null'], format: uuid }
        currentVersionNumber: { type: [integer, 'null'], minimum: 1 }
        currentVersionEffectiveFrom: { type: [string, 'null'], format: date-time }
        currentVersionLockedAt: { type: [string, 'null'], format: date-time }
        readContext: { $ref: '#/components/schemas/WorkoutPlanReadContext' }
    WorkoutPlanDetail:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan: { $ref: '#/components/schemas/WorkoutPlanSummary' }
        currentVersion:
          oneOf:
            - { $ref: '#/components/schemas/WorkoutPlanVersionSummary' }
            - { type: 'null' }
    WorkoutPlanVersionSummary:
      type: object
      additionalProperties: false
      required: [id, planId, versionNumber, effectiveFrom, changeLevel,
        createdBy, createdAt, current, readContext]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: [string, 'null'], format: date-time }
        changeLevel: { type: string, enum: [INITIAL, MAJOR, AI_ACCEPTED] }
        changeReason: { type: [string, 'null'] }
        changeSummary: { type: [string, 'null'] }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lockedAt: { type: [string, 'null'], format: date-time }
        current: { type: boolean }
        readContext: { $ref: '#/components/schemas/WorkoutPlanReadContext' }
    WorkoutPlanVersionDetail:
      type: object
      additionalProperties: false
      required: [version, sessions]
      properties:
        version: { $ref: '#/components/schemas/WorkoutPlanVersionSummary' }
        sessions: { type: array, items: { $ref: '#/components/schemas/WorkoutPlanSession' } }
    WorkoutPlanSession:
      type: object
      additionalProperties: false
      required: [id, weekNumber, dayNumber, sequenceNumber, name, prescriptions]
      properties:
        id: { type: string, format: uuid }
        weekNumber: { type: integer, minimum: 1 }
        dayNumber: { type: integer, minimum: 1 }
        sequenceNumber: { type: integer, minimum: 1 }
        name: { type: string }
        focus: { type: [string, 'null'] }
        estimatedDurationMinutes: { type: [integer, 'null'], minimum: 1 }
        notes: { type: [string, 'null'] }
        prescriptions: { type: array, items: { $ref: '#/components/schemas/WorkoutPlanPrescription' } }
    WorkoutPlanPrescription:
      type: object
      additionalProperties: false
      required: [id, exerciseVariationId, sequenceNumber, exercise]
      properties:
        id: { type: string, format: uuid }
        exerciseVariationId: { type: string, format: uuid }
        sequenceNumber: { type: integer, minimum: 1 }
        targetSets: { type: [integer, 'null'], minimum: 1 }
        targetRepsMin: { type: [integer, 'null'], minimum: 0 }
        targetRepsMax: { type: [integer, 'null'], minimum: 0 }
        targetLoad: { type: [number, 'null'], minimum: 0 }
        restSeconds: { type: [integer, 'null'], minimum: 0 }
        durationSeconds: { type: [integer, 'null'], minimum: 0 }
        instructions: { type: [string, 'null'] }
        exercise: { $ref: '#/components/schemas/WorkoutPlanExercisePresentation' }
    WorkoutPlanExercisePresentation:
      type: object
      additionalProperties: false
      required: [variationId, state]
      properties:
        variationId: { type: string, format: uuid }
        exerciseId: { type: [string, 'null'], format: uuid }
        exerciseName: { type: [string, 'null'] }
        variationName: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/WorkoutPlanExercisePresentationState' }
        canonicalExerciseId: { type: [string, 'null'], format: uuid }
        canonicalExerciseName: { type: [string, 'null'] }
    WorkoutPlanSessionInput:
      type: object
      additionalProperties: false
      required: [weekNumber, dayNumber, sequenceNumber, name, prescriptions]
      properties:
        weekNumber: { type: integer, minimum: 1 }
        dayNumber: { type: integer, minimum: 1 }
        sequenceNumber: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 180 }
        focus: { type: [string, 'null'], maxLength: 160 }
        estimatedDurationMinutes: { type: [integer, 'null'], minimum: 1 }
        notes: { type: [string, 'null'] }
        prescriptions: { type: array, items: { $ref: '#/components/schemas/WorkoutPlanPrescriptionInput' } }
    WorkoutPlanPrescriptionInput:
      type: object
      additionalProperties: false
      required: [exerciseVariationId, sequenceNumber]
      properties:
        exerciseVariationId: { type: string, format: uuid }
        sequenceNumber: { type: integer, minimum: 1 }
        targetSets: { type: [integer, 'null'], minimum: 1 }
        targetRepsMin: { type: [integer, 'null'], minimum: 0 }
        targetRepsMax: { type: [integer, 'null'], minimum: 0 }
        targetLoad: { type: [number, 'null'], minimum: 0 }
        restSeconds: { type: [integer, 'null'], minimum: 0 }
        durationSeconds: { type: [integer, 'null'], minimum: 0 }
        instructions: { type: [string, 'null'] }
    CreateWorkoutPlanDraftRequest:
      type: object
      additionalProperties: false
      required: [studentId, name, sessions, commandKey]
      properties:
        studentId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'] }
        sessions: { type: array, items: { $ref: '#/components/schemas/WorkoutPlanSessionInput' } }
        commandKey: { $ref: '#/components/schemas/WorkoutPlanCommandKey' }
    UpdateWorkoutPlanDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, name, sessions, commandKey]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'] }
        sessions: { type: array, items: { $ref: '#/components/schemas/WorkoutPlanSessionInput' } }
        commandKey: { $ref: '#/components/schemas/WorkoutPlanCommandKey' }
    WorkoutPlanVersionedCommandRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, commandKey]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        commandKey: { $ref: '#/components/schemas/WorkoutPlanCommandKey' }
    TransitionWorkoutPlanRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, target, commandKey]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        target: { $ref: '#/components/schemas/WorkoutPlanStatus' }
        reason: { type: [string, 'null'] }
        commandKey: { $ref: '#/components/schemas/WorkoutPlanCommandKey' }
    PublishWorkoutPlanVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, sessions, commandKey]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 100 }
        summary: { type: [string, 'null'] }
        sessions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WorkoutPlanSessionInput' } }
        commandKey: { $ref: '#/components/schemas/WorkoutPlanCommandKey' }
    CreateWorkoutPlanSuccessorRequest:
      type: object
      additionalProperties: false
      required: [sourcePlanId, sourceVersionId, name, commandKey]
      properties:
        sourcePlanId: { type: string, format: uuid }
        sourceVersionId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        commandKey: { $ref: '#/components/schemas/WorkoutPlanCommandKey' }
    WorkoutOccurrenceAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, type, afterValue, reason, commandKey]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        type: { type: string, enum: [EXERCISE_SWAP, LOAD, REPS, SETS, DURATION, ORDER, NOTE, OTHER] }
        plannedSessionExerciseId: { type: [string, 'null'], format: uuid }
        replacementVariationId: { type: [string, 'null'], format: uuid }
        beforeValue: {}
        afterValue: { not: { type: 'null' } }
        reason: { type: string, minLength: 1 }
        commandKey: { $ref: '#/components/schemas/WorkoutPlanCommandKey' }
    WorkoutPlanCommandKey:
      type: string
      minLength: 1
      maxLength: 120
      description: Stable caller-generated key scoped to the authenticated actor and logical command.
    WorkoutPlanCommandResponse:
      type: object
      additionalProperties: false
      required: [planId, status, aggregateVersion, effectiveAt, replayed]
      properties:
        planId: { type: string, format: uuid }
        planVersionId: { type: [string, 'null'], format: uuid }
        planVersionNumber: { type: [integer, 'null'], minimum: 1 }
        status: { $ref: '#/components/schemas/WorkoutPlanStatus' }
        aggregateVersion: { type: integer, format: int64, minimum: 0 }
        effectiveAt: { type: string, format: date-time }
        replayed: { type: boolean }
    WorkoutOccurrenceAdjustmentResponse:
      type: object
      additionalProperties: false
      required: [plannedWorkoutId, occurrenceVersion, replayed]
      properties:
        plannedWorkoutId: { type: string, format: uuid }
        adjustmentId: { type: [string, 'null'], format: uuid, description: Null on idempotent replay. }
        occurrenceVersion: { type: integer, format: int64, minimum: 0 }
        replayed: { type: boolean }
    CoachingDirection:
      type: string
      enum: [INCOMING, OUTGOING]
    CoachingStatus:
      type: string
      enum: [PENDING, ACTIVE, PAUSED, ENDED, REJECTED, CANCELLED]
    CoachingResumeStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]
    CoachingMode:
      type: string
      enum: [HUMAN_COACH, SELF_DIRECTED]
    CoachingDataScope:
      type: string
      enum: [FITNESS_GOAL, WORKOUT_PLAN, WORKOUT_HISTORY, WORKOUT_PLAN_HISTORY, BODY_METRICS, PROGRESS_PHOTOS, NUTRITION_LOGS, AI_RECOMMENDATIONS]
    CoachingSharingDecision:
      type: string
      enum: [ALLOW, DENY]
    CoachingDataAccessLevel:
      type: string
      description: Ordered sufficiency is MANAGE > CONTRIBUTE > VIEW; owning-domain rules still apply.
      enum: [VIEW, CONTRIBUTE, MANAGE]
    CoachingPermissionPresentationState:
      type: string
      description: Backend-derived presentation state of the latest decision for one scope.
      enum: [NOT_CONFIGURED, ALLOWED, DENIED, EXPIRED, REVOKED]
    ParticipantSummary:
      type: object
      additionalProperties: false
      required: [userId, displayName]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
    TrainerDirectoryItem:
      type: object
      additionalProperties: false
      required: [trainerId, displayName]
      properties:
        trainerId: { type: string, format: uuid }
        displayName: { type: string }
    TrainerDirectoryPage:
      type: object
      additionalProperties: false
      required: [items, page, size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TrainerDirectoryItem' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
    StudentLookup:
      type: object
      additionalProperties: false
      required: [studentId, displayName]
      properties:
        studentId: { type: string, format: uuid }
        displayName: { type: string }
    CoachingInitiateRequest:
      type: object
      additionalProperties: false
      required: [counterpartyId, commandKey]
      properties:
        counterpartyId: { type: string, format: uuid }
        commandKey: { type: string, format: uuid }
    CoachingActionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, commandKey]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        commandKey: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }
    CoachingResumeActionRequest:
      type: object
      additionalProperties: false
      required: [expectedRelationshipVersion, expectedRequestVersion, commandKey]
      properties:
        expectedRelationshipVersion: { type: integer, format: int64, minimum: 0 }
        expectedRequestVersion: { type: integer, format: int64, minimum: 0 }
        commandKey: { type: string, format: uuid }
    CoachingSharingGrantRequest:
      type: object
      additionalProperties: false
      required: [dataScope, decision, accessLevel, commandKey]
      dependentRequired:
        historyUntil: [historyFrom]
      properties:
