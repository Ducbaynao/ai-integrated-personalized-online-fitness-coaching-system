services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: digital-fitness-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_fitness}
      POSTGRES_USER: ${POSTGRES_USER:-fitness_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fitness_app} -d ${POSTGRES_DB:-digital_fitness}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/backend/src/main/resources/db/migration:/flyway/sql:ro
    command:
      - "-url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-digital_fitness}"
      - "-user=${POSTGRES_USER:-fitness_app}"
      - "-password=${POSTGRES_PASSWORD:-change-me}"
      - "-schemas=fitness"
      - "-defaultSchema=fitness"
      - "-connectRetries=60"
      - "migrate"

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fitness_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-now}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: digital-fitness-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mailpit_data:
