spring:
  application:
    name: fitness-coaching-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/digital_fitness}
    username: ${DATABASE_USERNAME:fitness_app}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      schema: fitness
      connection-init-sql: SET search_path TO fitness, public;
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fitness
    open-in-view: false
  flyway:
    enabled: true
    schemas: fitness
    default-schema: fitness
  jackson:
    deserialization:
      fail-on-unknown-properties: true

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: WARN

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  jwt:
    issuer: ${JWT_ISSUER:fitness-coaching-backend}
    secret: ${JWT_SECRET:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}

ai:
  service:
    enabled: ${AI_SERVICE_ENABLED:true}
    mode: ${AI_SERVICE_MODE:simulated} # 'simulated' or 'http'
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-service-key: ${AI_INTERNAL_SERVICE_KEY:dev-ai-internal-key-change-me}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:10000}
  embedding:
    provider: ${AI_EMBEDDING_PROVIDER:simulated} # 'simulated' or 'openai'
    openai:
      api-key: ${AI_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${AI_EMBEDDING_BASE_URL:https://api.openai.com}
      model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
      model-space: ${AI_EMBEDDING_MODEL_SPACE:openai/text-embedding-3-small/1536}
      dimension: ${AI_EMBEDDING_DIMENSION:1536}
      connect-timeout-ms: ${AI_EMBEDDING_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${AI_EMBEDDING_READ_TIMEOUT_MS:10000}
      max-attempts: ${AI_EMBEDDING_MAX_ATTEMPTS:2}
      overall-deadline-ms: ${AI_EMBEDDING_OVERALL_DEADLINE_MS:15000}

app:
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
    attention-review:
      cron: ${ATTENTION_REVIEW_CRON:0 */5 * * * *}

