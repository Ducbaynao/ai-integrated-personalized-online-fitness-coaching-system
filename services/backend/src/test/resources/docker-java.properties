# Docker Engine 29+ (such as Docker Desktop 4.52+) enforces a minimum API version of 1.44.
# Testcontainers 1.20.4 bundles docker-java client version 3.4.0 which defaults to Docker API 1.32.
# When negotiating with Docker Engine 29+, the daemon rejects API 1.32 with HTTP 400 Bad Request,
# preventing Testcontainers from discovering the Docker environment.
# Setting api.version=1.44 ensures predictable execution across Docker 25+ through Docker 29+
# in both local developer environments (Windows/macOS/Linux) and modern CI runners.
api.version=1.44
